<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>P&ID Studio Pro - Full Engineering Edition (ISA 2024)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121217; color: #ffffff; display: flex; flex-direction: column; }
    
    header { background-color: #1a1a24; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2e2e40; z-index: 100; flex-wrap: wrap; gap: 6px; }
    .toolbar-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    
    button { background-color: #282a3a; color: #e2e8f0; border: 1px solid #3f4259; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; transition: all 0.2s; }
    button:hover { background-color: #3b3e57; border-color: #5d6287; }
    button:active { transform: scale(0.96); }
    button.active-mode { background-color: #10b981 !important; border-color: #059669 !important; color: #ffffff !important; }

    .btn-pipe-type { background-color: #181822; font-size: 10px; padding: 4px 7px; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
    .btn-pipe-type span { font-size: 8px; color: #94a3b8; }
    .btn-pipe-type.selected { border-color: #38bdf8; background-color: #0284c7; color: #ffffff; }
    .btn-pipe-type.selected span { color: #e0f2fe; }
    
    .btn-history { background-color: #334155; border-color: #475569; }
    .btn-project { background-color: #475569; border-color: #64748b; }
    .btn-bom { background-color: #059669; border-color: #10b981; color: white;}
    .btn-bom:hover { background-color: #047857; }
    .btn-ai { background-color: #7c3aed; border-color: #8b5cf6; color: white; }
    .btn-ai:hover { background-color: #6d28d9; }

    .btn-delete-item { background-color: #e11d48; border-color: #be123c; color: #ffffff; }
    .btn-delete-item:hover { background-color: #be123c; }
    .btn-export { background-color: #2563eb; border-color: #1d4ed8; color: #ffffff; }
    .btn-danger { background-color: #7f1d1d; border-color: #991b1b; color: #fca5a5; }

    #main-layout { flex: 1; display: flex; height: calc(100vh - 52px); overflow: hidden; }
    
    #sidebar { width: 340px; background-color: #161620; border-right: 2px solid #2e2e40; display: flex; flex-direction: column; overflow: hidden; }
    
    .search-container { padding: 10px; background-color: #1a1a24; border-bottom: 1px solid #2e2e40; }
    .search-input { width: 100%; background: #121217; border: 1px solid #3f4259; color: #fff; padding: 7px 10px; border-radius: 4px; font-size: 12px; outline: none; }
    .search-input:focus { border-color: #38bdf8; }

    .sidebar-content { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .sidebar-content::-webkit-scrollbar { width: 8px; }
    .sidebar-content::-webkit-scrollbar-track { background: #161620; }
    .sidebar-content::-webkit-scrollbar-thumb { background: #3f4259; border-radius: 4px; }

    .category-box { border: 1px solid #272738; border-radius: 6px; background-color: #1b1b26; padding: 8px; }
    .category-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #38bdf8; margin-bottom: 8px; font-weight: bold; border-bottom: 1px solid #2e2e40; padding-bottom: 4px; }
    .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

    .item-card { background-color: #222333; border: 1px solid #33354d; border-radius: 4px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; height: 60px; }
    .item-card:hover { background-color: #3b82f6; border-color: #60a5fa; transform: translateY(-2px); }
    .item-card svg { width: 32px; height: 32px; pointer-events: none; }
    .item-card span { font-size: 9px; color: #cbd5e1; text-align: center; margin-top: 4px; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
    .item-card:hover span { color: #ffffff; }

    #canvas-container { flex: 1; position: relative; background-color: #121217; background-image: radial-gradient(#2b2b3d 1.5px, transparent 1.5px); background-size: 24px 24px; overflow: hidden; }
    svg#pid-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }

    .symbol-group { cursor: move; }
    .pipe-group { cursor: pointer; }
    .symbol-group.is-selected { outline: 2px dashed #facc15 !important; outline-offset: 4px; }
    
    .pipe-node { fill: #facc15; stroke: #121217; stroke-width: 2px; cursor: move; display: none; }
    .pipe-group.is-selected .pipe-node { display: block; }
    .pipe-group.is-selected .pipe-visible { stroke: #facc15 !important; stroke-width: 4px !important; }

    .bom-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; }
    .bom-content { background: #1e1e2e; padding: 20px; border-radius: 8px; width: 700px; max-width: 95%; max-height: 90vh; border: 1px solid #33334d; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
    .bom-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .bom-header h2 { font-size: 18px; color: #38bdf8; }
    .close-bom { cursor: pointer; font-size: 24px; color: #ef4444; font-weight: bold; }
    .bom-table-container { overflow-y: auto; flex: 1; border: 1px solid #33334d; border-radius: 4px; }
    .bom-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .bom-table th, .bom-table td { border-bottom: 1px solid #33334d; padding: 8px; text-align: left; }
    .bom-table th { background: #282a3a; color: #cbd5e1; position: sticky; top: 0; }
    .bom-table tr:hover { background: #222333; }
    
    .ai-textarea { width: 100%; height: 150px; background: #121217; border: 1px solid #3f4259; color: #fff; padding: 10px; border-radius: 4px; font-size: 12px; resize: none; outline: none; margin-bottom: 10px; }
    .ai-textarea:focus { border-color: #8b5cf6; }
  </style>
</head>
<body>

  <header>
    <div class="toolbar-group">
      <button class="btn-history" onclick="undoAction()" title="Deshacer (Ctrl + Z)">↶</button>
      <button class="btn-history" onclick="redoAction()" title="Rehacer (Ctrl + Y)">↷</button>
      <button class="btn-delete-item" onclick="deleteSelectedItem()" title="Eliminar seleccionado">✕</button>

      <button id="pipe-btn" onclick="togglePipeMode()">Trazar Línea (90°)</button>
      <button id="pipe-process" class="btn-pipe-type selected" onclick="setPipeStyle('process')">Tubería Principal <span>Proceso</span></button>
      <button id="pipe-pneumatic" class="btn-pipe-type" onclick="setPipeStyle('pneumatic')">Señal Neumática <span>[IA / PA]</span></button>
      <button id="pipe-electric" class="btn-pipe-type" onclick="setPipeStyle('electric')">Señal Eléctrica <span>[ES]</span></button>
      <button id="pipe-data" class="btn-pipe-type" onclick="setPipeStyle('data')">Bus de Datos <span>DCS / PLC</span></button>
    </div>

    <div class="toolbar-group">
      <button class="btn-ai" onclick="openAIModal()">🤖 Generar desde Texto</button>
      <button class="btn-bom" onclick="generateBOM()">📋 Cómputo BOM</button>
      <button class="btn-project" onclick="saveProjectJSON()">💾 Guardar</button>
      <button class="btn-project" onclick="document.getElementById('load-json-input').click()">📂 Cargar</button>
      <input type="file" id="load-json-input" style="display: none;" accept=".json" onchange="loadProjectJSON(event)">
      <button class="btn-export" onclick="exportPNG()">PNG</button>
      <button class="btn-danger" onclick="clearCanvas()">Limpiar</button>
    </div>
  </header>

  <div id="main-layout">
    <aside id="sidebar">
      <div class="search-container">
        <input type="text" id="symbol-search" class="search-input" placeholder="🔍 Buscar componente..." oninput="filterSidebar(this.value)">
      </div>
      <div class="sidebar-content" id="sidebar-scroll"></div>
    </aside>

    <main id="canvas-container">
      <svg id="pid-canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" /></marker>
          <marker id="arrow-selected" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15" /></marker>
        </defs>
        <g id="pipes-layer"></g>
        <g id="symbols-layer"></g>
      </svg>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('pid-canvas');
    const symbolsLayer = document.getElementById('symbols-layer');
    const pipesLayer = document.getElementById('pipes-layer');
    const sidebarScroll = document.getElementById('sidebar-scroll');
    const SVG_NS = "http://www.w3.org/2000/svg";
    
    let isPipeMode = false, pipeType = 'process', pipeStartPoint = null, activePipeGroup = null;
    let draggingElement = null, draggingNode = null, selectedTarget = null, offset = { x: 0, y: 0 };
    let lastAIText = `Ejercicio 1: Sistema de control de nivel y temperatura de un tanque de proceso TK-101 con agitador M-101, serpentín de calentamiento E-101, bomba de salida P-101, termopozo TE-101, válvula de control y controlador TIC-101.`;

    function txt(t, y=0, size="10px", color="#ffffff") { return `<text x="0" y="${y}" fill="${color}" font-size="${size}" font-weight="bold" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">${t}</text>`; }

    const componentLibrary = {
      'tk_vert': { cat: '1. Estanques', name: 'Estanque Vertical', svg: `<rect x="-35" y="-55" width="70" height="110" rx="12" fill="#202230" stroke="#fff" stroke-width="2.5"/>${txt('TK-101', 0, '11px')}` },
      'hx_circ': { cat: '2. Térmicos', name: 'Serpentín / Interc.', svg: `<circle cx="0" cy="0" r="25" fill="#202230" stroke="#fff" stroke-width="2.5"/><path d="M -15 -8 L -5 8 L 5 -8 L 15 8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>${txt('E-101', 36, '11px')}` },
      'p_centrif': { cat: '4. Bombas', name: 'Bomba Centrífuga', svg: `<circle cx="0" cy="0" r="22" fill="#202230" stroke="#fff" stroke-width="2.5"/><path d="M -16 -10 L 14 0 L -16 10 Z" fill="none" stroke="#fff" stroke-width="2"/>${txt('P-101', 34, '11px')}` },
      'motor_ac': { cat: '4. Bombas y Motores', name: 'Agitador / Motor', svg: `<circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>${txt('M', -3, '14px', '#f59e0b')}${txt('M-101', 32, '11px')}` },
      'act_diaph': { cat: '7. Válvulas Auto', name: 'Válvula de Control', svg: `<path d="M -18 -10 L 0 0 L -18 10 Z M 18 -10 L 0 0 L 18 10 Z" fill="#384260" stroke="#fff" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="-14" stroke="#fff" stroke-width="2"/><path d="M -14 -22 A 14 14 0 0 1 14 -22 Z" fill="#202230" stroke="#38bdf8" stroke-width="2"/>${txt('FCV', 22, '11px')}` },
      'sens_temp': { cat: '8. Sensores', name: 'Termopozo (TE)', svg: `<line x1="-12" y1="8" x2="12" y2="8" stroke="#fff" stroke-width="2"/><line x1="0" y1="-15" x2="0" y2="8" stroke="#f87171" stroke-width="2.5"/><circle cx="0" cy="-15" r="4" fill="#f87171"/>${txt('TE', -26, '10px', '#f87171')}` },
      'isa_panel': { cat: '9. Instrumentación', name: 'Controlador (TIC)', svg: `<rect x="-22" y="-22" width="44" height="44" fill="#161620" stroke="#38bdf8" stroke-width="2"/><circle cx="0" cy="0" r="20" fill="none" stroke="#38bdf8" stroke-width="1.5"/><line x1="-20" y1="0" x2="20" y2="0" stroke="#38bdf8" stroke-width="1.5"/>${txt('TIC', -6, '9px', '#38bdf8')}${txt('101', 8, '9px')}` }
    };

    function renderSidebar(filterText = '') {
      const categories = {};
      for (let key in componentLibrary) {
        const item = componentLibrary[key];
        if (filterText && !item.name.toLowerCase().includes(filterText.toLowerCase()) && !item.cat.toLowerCase().includes(filterText.toLowerCase())) continue;
        if (!categories[item.cat]) categories[item.cat] = [];
        categories[item.cat].push({ key, name: item.name, svg: item.svg });
      }
      let html = '';
      Object.keys(categories).sort().forEach(cat => {
        html += `<div class="category-box"><div class="category-title">${cat.substring(3)}</div><div class="category-grid">`;
        categories[cat].forEach(item => {
          html += `<div class="item-card" onclick="addSymbol('${item.key}')" title="${item.name}"><svg viewBox="-50 -50 100 100">${item.svg}</svg><span>${item.name}</span></div>`;
        });
        html += `</div></div>`;
      });
      sidebarScroll.innerHTML = html || '<p style="font-size:11px; color:#94a3b8; text-align:center; padding:20px;">No se encontraron componentes</p>';
    }
    renderSidebar();

    // --- MODAL DINÁMICO DE IA / GENERACIÓN POR TEXTO ---
    function openAIModal() {
      let html = `<div class="bom-modal" id="ai-modal"><div class="bom-content">
        <div class="bom-header"><h2>🤖 Generador Automático de P&ID (IA)</h2><span class="close-bom" onclick="document.getElementById('ai-modal').remove()">&times;</span></div>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">Cambia o escribe un nuevo ejercicio. El generador creará los equipos y sus líneas de conexión ordenadas:</p>
        <textarea class="ai-textarea" id="ai-input">${lastAIText}</textarea>
        <div style="text-align: right;"><button class="btn-ai" onclick="processAIText()">⚡ Generar / Actualizar Diagrama</button></div>
      </div></div>`;
      const existingModal = document.getElementById('ai-modal');
      if(existingModal) existingModal.remove();
      const div = document.createElement('div'); div.innerHTML = html; document.body.appendChild(div.firstElementChild);
    }

    function processAIText() {
      const textarea = document.getElementById('ai-input');
      if(!textarea) return;
      lastAIText = textarea.value;
      const text = lastAIText.toUpperCase();
      document.getElementById('ai-modal').remove();
      saveState();
      
      symbolsLayer.innerHTML = ''; pipesLayer.innerHTML = '';

      const elementsMap = [
        { type: 'tk_vert', x: 350, y: 320, tag: 'TK-101' },
        { type: 'motor_ac', x: 350, y: 210, tag: 'M-101' },
        { type: 'hx_circ', x: 350, y: 340, tag: 'E-101' },
        { type: 'sens_temp', x: 440, y: 320, tag: 'TE-101' },
        { type: 'isa_panel', x: 550, y: 320, tag: 'TIC-101' },
        { type: 'act_diaph', x: 200, y: 340, tag: 'FCV-101' },
        { type: 'p_centrif', x: 350, y: 500, tag: 'P-101' }
      ];

      elementsMap.forEach(el => {
        const group = document.createElementNS(SVG_NS, 'g');
        group.setAttribute('class', 'symbol-group');
        group.setAttribute('data-type', el.type);
        group.setAttribute('transform', `translate(${el.x}, ${el.y})`);
        group.innerHTML = componentLibrary[el.type].svg;
        
        const textNode = group.querySelector('text');
        if (textNode && el.tag) textNode.textContent = el.tag;

        symbolsLayer.appendChild(group);
        setupSymbolEvents(group);
      });

      // Trazado automático de tuberías de proceso y señales
      const pipesMap = [
        { from: {x: 350, y: 430}, to: {x: 350, y: 500}, type: 'process' },
        { from: {x: 200, y: 340}, to: {x: 315, y: 340}, type: 'process' },
        { from: {x: 440, y: 320}, to: {x: 530, y: 320}, type: 'electric' },
        { from: {x: 550, y: 342}, to: {x: 200, y: 364}, type: 'pneumatic' }
      ];

      pipesMap.forEach(p => {
        const pipeGroup = document.createElementNS(SVG_NS, 'g');
        pipeGroup.setAttribute('class', 'pipe-group');
        
        const midX = Math.round(p.from.x + (p.to.x - p.from.x) / 2);
        const pathData = `M ${p.from.x} ${p.from.y} L ${midX} ${p.from.y} L ${midX} ${p.to.y} L ${p.to.x} ${p.to.y}`;
        
        const visPath = document.createElementNS(SVG_NS, 'path');
        visPath.setAttribute('class', 'pipe-visible');
        visPath.setAttribute('d', pathData);
        visPath.setAttribute('fill', 'none');
        visPath.setAttribute('stroke-linejoin', 'round');
        
        if (p.type === 'process') {
          visPath.setAttribute('stroke', '#38bdf8'); visPath.setAttribute('stroke-width', '3.5'); visPath.setAttribute('marker-end', 'url(#arrow)');
        } else if (p.type === 'pneumatic') {
          visPath.setAttribute('stroke', '#f87171'); visPath.setAttribute('stroke-width', '2'); visPath.setAttribute('stroke-dasharray', '14,4,2,4');
        } else if (p.type === 'electric') {
          visPath.setAttribute('stroke', '#fbbf24'); visPath.setAttribute('stroke-width', '2'); visPath.setAttribute('stroke-dasharray', '6,4');
        }

        const hitArea = document.createElementNS(SVG_NS, 'path');
        hitArea.setAttribute('class', 'pipe-hit-area');
        hitArea.setAttribute('d', pathData);
        hitArea.setAttribute('fill', 'none');
        hitArea.setAttribute('stroke', 'transparent');
        hitArea.setAttribute('stroke-width', '26');

        pipeGroup.appendChild(visPath);
        pipeGroup.appendChild(hitArea);
        pipesLayer.appendChild(pipeGroup);
        bindPipeGroupEvents(pipeGroup);
      });
    }

    // --- LOGICA CORE Y NODOS DE MOVIMIENTO ---
    const undoStack = []; const redoStack = [];
    function saveState() {
      undoStack.push({ symbols: symbolsLayer.innerHTML, pipes: pipesLayer.innerHTML });
      if (undoStack.length > 30) undoStack.shift(); redoStack.length = 0;
    }
    function undoAction() { if (undoStack.length === 0) return; redoStack.push({ symbols: symbolsLayer.innerHTML, pipes: pipesLayer.innerHTML }); restoreLayers(undoStack.pop()); }
    function redoAction() { if (redoStack.length === 0) return; undoStack.push({ symbols: symbolsLayer.innerHTML, pipes: pipesLayer.innerHTML }); restoreLayers(redoStack.pop()); }
    function restoreLayers(state) {
      clearSelection(); symbolsLayer.innerHTML = state.symbols; pipesLayer.innerHTML = state.pipes;
      symbolsLayer.querySelectorAll('.symbol-group').forEach(setupSymbolEvents); pipesLayer.querySelectorAll('.pipe-group').forEach(bindPipeGroupEvents);
    }
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redoAction() : undoAction(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redoAction(); }
      else if (e.key === 'Delete' || e.key === 'Backspace' || e.key === 'Supr') { if (selectedTarget && document.activeElement.tagName !== 'INPUT') deleteSelectedItem(); }
    });

    function getCoords(evt) {
      const rect = canvas.getBoundingClientRect(); const cx = evt.touches ? evt.touches[0].clientX : evt.clientX; const cy = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    function selectElement(elem) { if (selectedTarget && selectedTarget !== elem) selectedTarget.classList.remove('is-selected'); selectedTarget = elem; if (selectedTarget) selectedTarget.classList.add('is-selected'); }
    function clearSelection() { if (selectedTarget) { selectedTarget.classList.remove('is-selected'); selectedTarget = null; } }
    function deleteSelectedItem() { if (selectedTarget) { saveState(); selectedTarget.remove(); selectedTarget = null; } }
    canvas.addEventListener('mousedown', (e) => { if (e.target === canvas && !isPipeMode && !e.target.classList.contains('pipe-node')) clearSelection(); });

    function updatePipeNodes(group) {
      group.querySelectorAll('.pipe-node').forEach(n => n.remove());
      const visPath = group.querySelector('.pipe-visible');
      if (!visPath) return;
      const pts = visPath.getAttribute('d').match(/[0-9.-]+/g);
      if (!pts || pts.length < 4) return;
      const coords = [];
      for (let i = 0; i < pts.length; i += 2) coords.push({ x: parseFloat(pts[i]), y: parseFloat(pts[i+1]) });

      coords.forEach((pt, index) => {
        const circle = document.createElementNS(SVG_NS, 'circle');
        circle.setAttribute('class', 'pipe-node'); circle.setAttribute('cx', pt.x); circle.setAttribute('cy', pt.y); circle.setAttribute('r', '5');
        circle.addEventListener('mousedown', (e) => { e.stopPropagation(); saveState(); draggingNode = { group, index, coords }; selectElement(group); });
        group.appendChild(circle);
      });
    }

    function addSymbol(type) {
      saveState();
      const rect = canvas.getBoundingClientRect(); const posX = rect.width ? rect.width / 2 : 350; const posY = rect.height ? rect.height / 2 : 300;
      const group = document.createElementNS(SVG_NS, 'g'); group.setAttribute('class', 'symbol-group'); group.setAttribute('data-type', type); group.setAttribute('transform', `translate(${posX}, ${posY})`);
      group.innerHTML = componentLibrary[type].svg;
      symbolsLayer.appendChild(group); setupSymbolEvents(group); selectElement(group);
    }

    function setupSymbolEvents(elem) {
      const handleStart = (e) => {
        if (isPipeMode) return; e.stopPropagation(); selectElement(elem); draggingElement = elem;
        const pos = getCoords(e); const match = /translate\(([^,]+),\s*([^)]+)\)/.exec(elem.getAttribute('transform'));
        offset = { x: pos.x - (match ? parseFloat(match[1]) : 0), y: pos.y - (match ? parseFloat(match[2]) : 0) };
      };
      elem.addEventListener('mousedown', handleStart); elem.addEventListener('touchstart', handleStart, { passive: false });
      elem.addEventListener('dblclick', (e) => {
        e.stopPropagation(); const texts = elem.querySelectorAll('text');
        if (texts.length > 0) {
          const val = prompt('Editar texto:', texts[0].textContent);
          if (val !== null && val.trim() !== '') { saveState(); texts[0].textContent = val.trim(); }
        }
      });
      elem.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); if (confirm('¿Eliminar componente?')) { saveState(); if (selectedTarget === elem) selectedTarget = null; elem.remove(); } });
    }

    function handleMove(e) {
      const pos = getCoords(e);
      if (draggingElement && !isPipeMode) {
        e.preventDefault(); draggingElement.setAttribute('transform', `translate(${Math.round((pos.x - offset.x) / 10) * 10}, ${Math.round((pos.y - offset.y) / 10) * 10})`);
      } else if (draggingNode) {
        e.preventDefault();
        const { group, index, coords } = draggingNode;
        coords[index] = { x: Math.round(pos.x / 5) * 5, y: Math.round(pos.y / 5) * 5 };
        let newD = `M ${coords[0].x} ${coords[0].y}`;
        for (let i = 1; i < coords.length; i++) newD += ` L ${coords[i].x} ${coords[i].y}`;
        group.querySelectorAll('path.pipe-visible, path.pipe-hit-area').forEach(p => p.setAttribute('d', newD));
        updatePipeNodes(group);
      } else if (activePipeGroup && isPipeMode && pipeStartPoint) {
        const midX = Math.round(pipeStartPoint.x + (pos.x - pipeStartPoint.x) / 2);
        const pathData = `M ${pipeStartPoint.x} ${pipeStartPoint.y} L ${midX} ${pipeStartPoint.y} L ${midX} ${pos.y} L ${pos.x} ${pos.y}`;
        activePipeGroup.querySelectorAll('path.pipe-visible, path.pipe-hit-area').forEach(p => p.setAttribute('d', pathData));
      }
    }

    function handleEnd() { if (draggingElement || draggingNode) { saveState(); draggingElement = null; draggingNode = null; } }
    canvas.addEventListener('mousemove', handleMove); canvas.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('mouseup', handleEnd); window.addEventListener('touchend', handleEnd);

    function togglePipeMode() { isPipeMode = !isPipeMode; document.getElementById('pipe-btn').classList.toggle('active-mode', isPipeMode); document.getElementById('pipe-btn').textContent = isPipeMode ? 'Modo Trazado 90°' : 'Trazar Línea (90°)'; canvas.style.cursor = isPipeMode ? 'cell' : 'crosshair'; activePipeGroup = null; pipeStartPoint = null; clearSelection(); }
    function setPipeStyle(type) { pipeType = type; document.querySelectorAll('.btn-pipe-type').forEach(b => b.classList.remove('selected')); document.getElementById(`pipe-${type}`).classList.add('selected'); }
    
    function bindPipeGroupEvents(group) {
      group.addEventListener('mousedown', (evt) => { if (!isPipeMode && !evt.target.classList.contains('pipe-node')) { evt.stopPropagation(); selectElement(group); updatePipeNodes(group); } });
      group.addEventListener('contextmenu', (evt) => { evt.preventDefault(); evt.stopPropagation(); if (confirm('¿Eliminar tramo?')) { saveState(); if (selectedTarget === group) selectedTarget = null; group.remove(); } });
    }

    canvas.addEventListener('mousedown', (e) => {
      if (!isPipeMode || e.target.closest('.symbol-group')) return;
      const pos = getCoords(e);
      if (!activePipeGroup) {
        saveState(); pipeStartPoint = { x: pos.x, y: pos.y };
        activePipeGroup = document.createElementNS(SVG_NS, 'g'); activePipeGroup.setAttribute('class', 'pipe-group');
        const initialPath = `M ${pos.x} ${pos.y} L ${pos.x} ${pos.y} L ${pos.x} ${pos.y} L ${pos.x} ${pos.y}`;
        const hitArea = document.createElementNS(SVG_NS, 'path'); hitArea.setAttribute('class', 'pipe-hit-area'); hitArea.setAttribute('d', initialPath); hitArea.setAttribute('fill', 'none'); hitArea.setAttribute('stroke', 'transparent'); hitArea.setAttribute('stroke-width', '26'); hitArea.setAttribute('cursor', 'pointer');
        const visPath = document.createElementNS(SVG_NS, 'path'); visPath.setAttribute('class', 'pipe-visible'); visPath.setAttribute('d', initialPath); visPath.setAttribute('fill', 'none'); visPath.setAttribute('stroke-linejoin', 'round'); visPath.setAttribute('cursor', 'pointer');
        
        if (pipeType === 'process') { visPath.setAttribute('stroke', '#38bdf8'); visPath.setAttribute('stroke-width', '3.5'); visPath.setAttribute('marker-end', 'url(#arrow)'); }
        else if (pipeType === 'pneumatic') { visPath.setAttribute('stroke', '#f87171'); visPath.setAttribute('stroke-width', '2'); visPath.setAttribute('stroke-dasharray', '14,4,2,4'); }
        else if (pipeType === 'electric') { visPath.setAttribute('stroke', '#fbbf24'); visPath.setAttribute('stroke-width', '2'); visPath.setAttribute('stroke-dasharray', '6,4'); }
        else if (pipeType === 'data') { visPath.setAttribute('stroke', '#a78bfa'); visPath.setAttribute('stroke-width', '2'); visPath.setAttribute('stroke-dasharray', '8,6'); }
        
        activePipeGroup.appendChild(visPath); activePipeGroup.appendChild(hitArea); pipesLayer.appendChild(activePipeGroup); bindPipeGroupEvents(activePipeGroup);
      } else { selectElement(activePipeGroup); updatePipeNodes(activePipeGroup); activePipeGroup = null; pipeStartPoint = null; }
    });

    function clearCanvas() { if (confirm('¿Vaciar todo?')) { saveState(); symbolsLayer.innerHTML = ''; pipesLayer.innerHTML = ''; activePipeGroup = null; selectedTarget = null; } }
    
    function generateBOM() {
      clearSelection(); const items = {};
      symbolsLayer.querySelectorAll('.symbol-group').forEach(el => {
        const type = el.getAttribute('data-type'); const name = componentLibrary[type] ? componentLibrary[type].name : 'Componente';
        const tag = el.querySelector('text') ? el.querySelector('text').textContent : 'S/N';
        if (!items[name]) items[name] = { count: 0, tags: [] };
        items[name].count++; items[name].tags.push(tag);
      });
      const pipeCount = pipesLayer.querySelectorAll('.pipe-group').length;
      let html = `<div class="bom-modal" id="bom-modal-container"><div class="bom-content"><div class="bom-header"><h2>📋 Lista de Materiales (BOM)</h2><span class="close-bom" onclick="document.getElementById('bom-modal-container').remove()">&times;</span></div><div class="bom-table-container"><table class="bom-table"><thead><tr><th style="width: 10%; text-align: center;">Cant.</th><th style="width: 40%;">Componente</th><th style="width: 50%;">Tags</th></tr></thead><tbody>`;
      for(let key in items) html += `<tr><td style="text-align: center; font-weight: bold; color: #38bdf8;">${items[key].count}</td><td>${key}</td><td style="color: #94a3b8;">${items[key].tags.join(', ')}</td></tr>`;
      html += `<tr><td style="text-align: center; font-weight: bold; color: #38bdf8;">${pipeCount}</td><td>Tramos de Líneas / Tuberías</td><td style="color: #94a3b8;">-</td></tr></tbody></table></div></div></div>`;
      const div = document.createElement('div'); div.innerHTML = html; document.body.appendChild(div.firstElementChild);
    }

    function exportPNG() {
      clearSelection(); symbolsLayer.querySelectorAll('.pipe-node').forEach(n => n.style.display = 'none');
      const img = new Image();
      img.onload = () => {
        const outCanvas = document.createElement('canvas'); outCanvas.width = canvas.clientWidth || 1600; outCanvas.height = canvas.clientHeight || 900;
        const ctx = outCanvas.getContext('2d'); ctx.fillStyle = '#121217'; ctx.fillRect(0, 0, outCanvas.width, outCanvas.height); ctx.drawImage(img, 0, 0);
        symbolsLayer.querySelectorAll('.pipe-node').forEach(n => n.style.display = '');
        const a = document.createElement('a'); a.download = 'diagrama.png'; a.href = outCanvas.toDataURL('image/png'); a.click();
      };
      img.src = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(canvas)], { type: 'image/svg+xml;charset=utf-8' }));
    }
    function saveProjectJSON() {
      clearSelection(); symbolsLayer.querySelectorAll('.pipe-node').forEach(n => n.remove());
      const blob = new Blob([JSON.stringify({ version: "8.2", symbolsHTML: symbolsLayer.innerHTML, pipesHTML: pipesLayer.innerHTML }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'proyecto.json'; a.click();
    }
    function loadProjectJSON(event) {
      const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
      reader.onload = (e) => { try { const data = JSON.parse(e.target.result); if (data.symbolsHTML !== undefined) { saveState(); restoreLayers(data); } } catch (err) { alert('Error al leer JSON'); } };
      reader.readAsText(file); event.target.value = '';
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
</body>
</html>
