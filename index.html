<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>P&ID Studio Pro - Full Engineering Edition (ISA 2024)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121217; color: #ffffff; display: flex; flex-direction: column; }
    
    header { background-color: #1a1a24; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2e2e40; z-index: 100; flex-wrap: wrap; gap: 6px; }
    .toolbar-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    
    button { background-color: #282a3a; color: #e2e8f0; border: 1px solid #3f4259; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; transition: all 0.2s; }
    button:hover { background-color: #3b3e57; border-color: #5d6287; }
    button:active { transform: scale(0.96); }
    button.active-mode { background-color: #10b981 !important; border-color: #059669 !important; color: #ffffff !important; }

    .btn-pipe-type { background-color: #181822; font-size: 10px; padding: 4px 6px; }
    .btn-pipe-type.selected { border-color: #38bdf8; background-color: #0284c7; color: #ffffff; }
    
    .btn-history { background-color: #334155; border-color: #475569; }
    .btn-project { background-color: #475569; border-color: #64748b; }
    .btn-bom { background-color: #059669; border-color: #10b981; color: white;}
    .btn-bom:hover { background-color: #047857; }
    .btn-delete-item { background-color: #e11d48; border-color: #be123c; color: #ffffff; }
    .btn-delete-item:hover { background-color: #be123c; }
    .btn-export { background-color: #2563eb; border-color: #1d4ed8; color: #ffffff; }
    .btn-danger { background-color: #7f1d1d; border-color: #991b1b; color: #fca5a5; }

    #main-layout { flex: 1; display: flex; height: calc(100vh - 52px); overflow: hidden; }
    
    #sidebar { width: 340px; background-color: #161620; border-right: 2px solid #2e2e40; display: flex; flex-direction: column; overflow: hidden; }
    
    .search-container { padding: 10px; background-color: #1a1a24; border-bottom: 1px solid #2e2e40; }
    .search-input { width: 100%; background: #121217; border: 1px solid #3f4259; color: #fff; padding: 7px 10px; border-radius: 4px; font-size: 12px; outline: none; }
    .search-input:focus { border-color: #38bdf8; }

    .sidebar-content { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .sidebar-content::-webkit-scrollbar { width: 8px; }
    .sidebar-content::-webkit-scrollbar-track { background: #161620; }
    .sidebar-content::-webkit-scrollbar-thumb { background: #3f4259; border-radius: 4px; }

    .category-box { border: 1px solid #272738; border-radius: 6px; background-color: #1b1b26; padding: 8px; }
    .category-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #38bdf8; margin-bottom: 8px; font-weight: bold; border-bottom: 1px solid #2e2e40; padding-bottom: 4px; }
    .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

    .item-card { background-color: #222333; border: 1px solid #33354d; border-radius: 4px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; height: 60px; }
    .item-card:hover { background-color: #3b82f6; border-color: #60a5fa; transform: translateY(-2px); }
    .item-card svg { width: 32px; height: 32px; pointer-events: none; }
    .item-card span { font-size: 9px; color: #cbd5e1; text-align: center; margin-top: 4px; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
    .item-card:hover span { color: #ffffff; }

    #canvas-container { flex: 1; position: relative; background-color: #121217; background-image: radial-gradient(#2b2b3d 1.5px, transparent 1.5px); background-size: 24px 24px; overflow: hidden; }
    svg#pid-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }

    .symbol-group { cursor: move; }
    .pipe-group { cursor: pointer; }
    .symbol-group.is-selected { outline: 2px dashed #facc15 !important; outline-offset: 4px; }
    .pipe-group.is-selected .pipe-visible { stroke: #facc15 !important; stroke-width: 4.5px !important; marker-end: url(#arrow-selected) !important; }
    .pipe-group.is-selected text { fill: #facc15 !important; }

    .bom-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; }
    .bom-content { background: #1e1e2e; padding: 20px; border-radius: 8px; width: 700px; max-width: 95%; max-height: 90vh; border: 1px solid #33334d; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
    .bom-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .bom-header h2 { font-size: 18px; color: #38bdf8; }
    .close-bom { cursor: pointer; font-size: 24px; color: #ef4444; font-weight: bold; }
    .bom-table-container { overflow-y: auto; flex: 1; border: 1px solid #33334d; border-radius: 4px; }
    .bom-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .bom-table th, .bom-table td { border-bottom: 1px solid #33334d; padding: 8px; text-align: left; }
    .bom-table th { background: #282a3a; color: #cbd5e1; position: sticky; top: 0; }
    .bom-table tr:hover { background: #222333; }
  </style>
</head>
<body>

  <header>
    <div class="toolbar-group">
      <button class="btn-history" onclick="undoAction()" title="Deshacer (Ctrl + Z)">↶</button>
      <button class="btn-history" onclick="redoAction()" title="Rehacer (Ctrl + Y)">↷</button>
      <button class="btn-delete-item" onclick="deleteSelectedItem()" title="Eliminar seleccionado">✕</button>

      <button id="pipe-btn" onclick="togglePipeMode()">Trazar Línea (90°)</button>
      <button id="pipe-process" class="btn-pipe-type selected" onclick="setPipeStyle('process')">Tubería</button>
      <button id="pipe-secondary" class="btn-pipe-type" onclick="setPipeStyle('secondary')">Secund.</button>
      <button id="pipe-electric" class="btn-pipe-type" onclick="setPipeStyle('electric')">Eléctrica</button>
      <button id="pipe-pneumatic" class="btn-pipe-type" onclick="setPipeStyle('pneumatic')">Neumática</button>
      <button id="pipe-hydraulic" class="btn-pipe-type" onclick="setPipeStyle('hydraulic')">Hidráulica</button>
      <button id="pipe-capillary" class="btn-pipe-type" onclick="setPipeStyle('capillary')">Capilar</button>
      <button id="pipe-data" class="btn-pipe-type" onclick="setPipeStyle('data')">Datos</button>
      <button id="pipe-wireless" class="btn-pipe-type" onclick="setPipeStyle('wireless')">Inalámb.</button>
    </div>

    <div class="toolbar-group">
      <button class="btn-bom" onclick="generateBOM()">📋 Cómputo BOM</button>
      <button class="btn-project" onclick="saveProjectJSON()">💾 Guardar</button>
      <button class="btn-project" onclick="document.getElementById('load-json-input').click()">📂 Cargar</button>
      <input type="file" id="load-json-input" style="display: none;" accept=".json" onchange="loadProjectJSON(event)">
      <button class="btn-export" onclick="exportSVG()">SVG</button>
      <button class="btn-export" onclick="exportPNG()">PNG</button>
      <button class="btn-danger" onclick="clearCanvas()">Limpiar</button>
    </div>
  </header>

  <div id="main-layout">
    <aside id="sidebar">
      <div class="search-container">
        <input type="text" id="symbol-search" class="search-input" placeholder="🔍 Buscar componente..." oninput="filterSidebar(this.value)">
      </div>
      <div class="sidebar-content" id="sidebar-scroll"></div>
    </aside>

    <main id="canvas-container">
      <svg id="pid-canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" /></marker>
          <marker id="arrow-selected" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15" /></marker>
        </defs>
        <g id="pipes-layer"></g>
        <g id="symbols-layer"></g>
      </svg>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('pid-canvas');
    const symbolsLayer = document.getElementById('symbols-layer');
    const pipesLayer = document.getElementById('pipes-layer');
    const sidebarScroll = document.getElementById('sidebar-scroll');
    const SVG_NS = "http://www.w3.org/2000/svg";
    
    let isPipeMode = false, pipeType = 'process', pipeStartPoint = null, activePipeGroup = null;
    let draggingElement = null, selectedTarget = null, offset = { x: 0, y: 0 };

    function txt(t, y=0, size="10px", color="#ffffff") { return `<text x="0" y="${y}" fill="${color}" font-size="${size}" font-weight="bold" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">${t}</text>`; }

    // --- BIBLIOTECA COMPLETA CON INSTRUMENTOS ISA CORREGIDOS ---
    const componentLibrary = {
      // 1. ESTANQUES Y RECIPIENTES
      'tk_vert': { cat: '1. Estanques', name: 'Vertical', svg: `<rect x="-35" y="-55" width="70" height="110" rx="12" fill="#202230" stroke="#fff" stroke-width="2.5"/>${txt('TK-101', 0, '11px')}` },
      'tk_horiz': { cat: '1. Estanques', name: 'Horizontal', svg: `<rect x="-55" y="-30" width="110" height="60" rx="12" fill="#202230" stroke="#fff" stroke-width="2.5"/>${txt('TK-102', 0, '11px')}` },
      'tk_sphere': { cat: '1. Estanques', name: 'Esférico', svg: `<circle cx="0" cy="-10" r="35" fill="#202230" stroke="#fff" stroke-width="2.5"/><path d="M -20 15 L -20 35 M 20 15 L 20 35 M -30 35 L 30 35" fill="none" stroke="#fff" stroke-width="2"/>${txt('SP', -10, '11px')}` },
      'tk_roof': { cat: '1. Estanques', name: 'Techo Flot.', svg: `<path d="M -40 -30 L -40 40 L 40 40 L 40 -30" fill="#202230" stroke="#fff" stroke-width="2.5"/><rect x="-35" y="-10" width="70" height="8" fill="#384260" stroke="#fff" stroke-width="2"/>${txt('TK-F', 20, '11px')}` },
      'tk_jacket': { cat: '1. Estanques', name: 'Enchaquetado', svg: `<rect x="-42" y="-35" width="84" height="80" rx="10" fill="#2d3148" stroke="#38bdf8" stroke-width="2"/><rect x="-32" y="-50" width="64" height="100" rx="8" fill="#202230" stroke="#fff" stroke-width="2.5"/>${txt('RE', 0, '11px')}` },
      'tower': { cat: '1. Estanques', name: 'Destilación', svg: `<rect x="-25" y="-70" width="50" height="140" rx="12" fill="#202230" stroke="#fff" stroke-width="2.5"/><line x1="-20" y1="-30" x2="20" y2="-30" stroke="#94a3b8" stroke-width="2"/><line x1="-20" y1="0" x2="20" y2="0" stroke="#94a3b8" stroke-width="2"/>${txt('T-101', 55, '11px')}` },
      'silo': { cat: '1. Estanques', name: 'Tolva / Silo', svg: `<path d="M -30 -35 L 30 -35 L 30 10 L 10 40 L -10 40 L -30 10 Z" fill="#202230" stroke="#fff" stroke-width="2.5"/>${txt('SILO', -5, '11px')}` },

      // 2. TÉRMICOS
      'hx_tube': { cat: '2. Térmicos', name: 'Tubos y Coraza', svg: `<rect x="-45" y="-20" width="90" height="40" rx="10" fill="#202230" stroke="#fff" stroke-width="2.5"/><path d="M -35 0 C -15 -20, -15 20, 0 0 C 15 -20, 15 20, 35 0" fill="none" stroke="#38bdf8" stroke-width="2.5"/>${txt('E-101', 32, '11px')}` },
      'hx_air': { cat: '2. Térmicos', name: 'Aeroenfriador', svg: `<rect x="-35" y="-15" width="70" height="30" fill="#202230" stroke="#fff" stroke-width="2.5"/><path d="M 0 -15 L -12 -30 M 0 -15 L 12 -30 M -18 -30 L 18 -30" fill="none" stroke="#38bdf8" stroke-width="2.5"/>${txt('AC', 28, '11px')}` },
      'hx_plate': { cat: '2. Térmicos', name: 'Placas', svg: `<rect x="-25" y="-35" width="50" height="70" fill="#202230" stroke="#fff" stroke-width="2.5"/><line x1="-25" y1="-35" x2="25" y2="35" stroke="#fff" stroke-width="2"/><line x1="-25" y1="35" x2="25" y2="-35" stroke="#fff" stroke-width="2"/>${txt('PHE', 48, '11px')}` },
      'furnace': { cat: '2. Térmicos', name: 'Horno / Caldera', svg: `<path d="M -30 40 L -30 10 L -12 -20 L -12 -50 L 12 -50 L 12 -20 L 30 10 L 30 40 Z" fill="#202230" stroke="#fff" stroke-width="2.5"/>${txt('F-101', 20, '11px')}` },

      // 3. SÓLIDOS Y SEPARACIÓN
      'filter': { cat: '3. Sólidos y Sep.', name: 'Filtro Genérico', svg: `<rect x="-20" y="-20" width="40" height="40" fill="#202230" stroke="#fff" stroke-width="2.5"/><line x1="-20" y1="20" x2="20" y2="-20" stroke="#fff" stroke-width="2.5"/>${txt('F', 32, '11px')}` },
      'centrifuge': { cat: '3. Sólidos y Sep.', name: 'Centrífuga', svg: `<rect x="-22" y="-22" width="44" height="44" fill="#202230" stroke="#fff" stroke-width="2.5"/><path d="M -22 0 L 22 0 M -12 0 L 0 -12 L 0 12 L 12 0" fill="none" stroke="#38bdf8" stroke-width="2.5"/>${txt('CF', 34, '11px')}` },
      'cyclone': { cat: '3. Sólidos y Sep.', name: 'Ciclón', svg: `<path d="M -25 -35 L 25 -35 L 25 0 L 0 40 L -25 0 Z" fill="#202230" stroke="#fff" stroke-width="2.5"/>${txt('CY', -10, '11px')}` },
      'crush_jaw': { cat: '3. Sólidos y Sep.', name: 'Trituradora', svg: `<polygon points="-25,-20 25,-20 15,20 -15,20" fill="#202230" stroke="#fff" stroke-width="2.5"/><line x1="-15" y1="-20" x2="-5" y2="15" stroke="#ef4444" stroke-width="3"/>${txt('CR', 32, '11px')}` },

      // 4. BOMBAS Y MOTORES
      'p_centrif': { cat: '4. Bombas y Motores', name: 'Centrífuga', svg: `<circle cx="0" cy="0" r="22" fill="#202230" stroke="#fff" stroke-width="2.5"/><path d="M -16 -10 L 14 0 L -16 10 Z" fill="none" stroke="#fff" stroke-width="2"/>${txt('P-101', 34, '11px')}` },
      'p_pos': { cat: '4. Bombas y Motores', name: 'Desplaz. P.', svg: `<circle cx="0" cy="0" r="22" fill="#202230" stroke="#fff" stroke-width="2.5"/><path d="M 0 -16 L 0 16 M -16 0 L 16 0" fill="none" stroke="#fff" stroke-width="2"/>${txt('PDP', 34, '11px')}` },
      'compressor': { cat: '4. Bombas y Motores', name: 'Compresor', svg: `<path d="M -22 -22 L 22 -10 L 22 10 L -22 22 Z" fill="#202230" stroke="#fff" stroke-width="2.5"/>${txt('C-101', 34, '11px')}` },
      'motor_ac': { cat: '4. Bombas y Motores', name: 'Motor CA', svg: `<circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>${txt('M', -3, '14px', '#f59e0b')}${txt('M-1', 32, '11px')}` },

      // 5. SENSORES DE FLUJO
      'fe_orifice': { cat: '5. Sensores de Flujo', name: 'Placa Orificio', svg: `<line x1="-5" y1="-16" x2="-5" y2="16" stroke="#fff" stroke-width="3"/><line x1="5" y1="-16" x2="5" y2="16" stroke="#fff" stroke-width="3"/>${txt('FE', 26, '11px')}` },
      'fe_venturi': { cat: '5. Sensores de Flujo', name: 'Tubo Venturi', svg: `<path d="M -22 -12 L -6 -5 L 6 -5 L 22 -12 L 22 12 L 6 5 L -6 5 L -22 12 Z" fill="#202230" stroke="#fff" stroke-width="2"/>${txt('FE', 24, '11px')}` },
      'fe_coriolis': { cat: '5. Sensores de Flujo', name: 'Coriolis', svg: `<rect x="-18" y="-18" width="36" height="36" fill="#202230" stroke="#fff" stroke-width="2.5"/><path d="M -10 -10 C -10 22, 10 22, 10 -10" fill="none" stroke="#38bdf8" stroke-width="2.5"/>${txt('FC', 30, '11px')}` },

      // 6. VÁLVULAS MANUALES
      'vlv_gate': { cat: '6. Válvulas Manuales', name: 'Compuerta', svg: `<path d="M -18 -10 L 0 0 L -18 10 Z M 18 -10 L 0 0 L 18 10 Z" fill="#384260" stroke="#fff" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="-14" stroke="#fff" stroke-width="2"/><line x1="-7" y1="-14" x2="7" y2="-14" stroke="#fff" stroke-width="2"/>${txt('HV', 22, '11px')}` },
      'vlv_globe': { cat: '6. Válvulas Manuales', name: 'Globo', svg: `<path d="M -18 -10 L 0 0 L -18 10 Z M 18 -10 L 0 0 L 18 10 Z" fill="#384260" stroke="#fff" stroke-width="2"/><circle cx="0" cy="0" r="4" fill="#fff"/><line x1="0" y1="-4" x2="0" y2="-14" stroke="#fff" stroke-width="2"/><line x1="-7" y1="-14" x2="7" y2="-14" stroke="#fff" stroke-width="2"/>${txt('GLV', 22, '11px')}` },
      'vlv_ball': { cat: '6. Válvulas Manuales', name: 'Bola', svg: `<path d="M -18 -10 L 0 0 L -18 10 Z M 18 -10 L 0 0 L 18 10 Z" fill="#384260" stroke="#fff" stroke-width="2"/><circle cx="0" cy="0" r="5" fill="#202230" stroke="#fff" stroke-width="2"/><line x1="0" y1="-5" x2="0" y2="-14" stroke="#fff" stroke-width="2"/><line x1="-7" y1="-14" x2="7" y2="-14" stroke="#fff" stroke-width="2"/>${txt('BV', 22, '11px')}` },
      'vlv_butter': { cat: '6. Válvulas Manuales', name: 'Mariposa', svg: `<line x1="-16" y1="0" x2="16" y2="0" stroke="#fff" stroke-width="2.5"/><line x1="-8" y1="-10" x2="8" y2="10" stroke="#38bdf8" stroke-width="3"/>${txt('BFV', 22, '11px')}` },

      'vlv_check': { cat: '7. Válvulas Auto/Seg.', name: 'Check', svg: `<path d="M -18 -10 L 0 0 L -18 10 Z M 18 -10 L 0 0 L 18 10 Z" fill="#384260" stroke="#fff" stroke-width="2"/><circle cx="-5" cy="0" r="3" fill="#38bdf8"/>${txt('CK', 22, '11px')}` },
      'vlv_relief': { cat: '7. Válvulas Auto/Seg.', name: 'Alivio (PSV)', svg: `<path d="M -16 0 L 0 0 L 0 16 Z M -16 0 L -16 16 L 0 16 Z" fill="#384260" stroke="#fff" stroke-width="2"/>${txt('PSV', 28, '11px')}` },
      'act_diaph': { cat: '7. Válvulas Auto/Seg.', name: 'Control Neum.', svg: `<path d="M -18 -10 L 0 0 L -18 10 Z M 18 -10 L 0 0 L 18 10 Z" fill="#384260" stroke="#fff" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="-14" stroke="#fff" stroke-width="2"/><path d="M -14 -22 A 14 14 0 0 1 14 -22 Z" fill="#202230" stroke="#38bdf8" stroke-width="2"/>${txt('FCV', 22, '11px')}` },

      // --- 9. SET COMPLETO DE INSTRUMENTOS ISA (24 VARIANTES) ---
      'isa_1': { cat: '9. Instrumentación ISA', name: 'Campo (Dividido)', svg: `<circle cx="0" cy="0" r="20" fill="#161620" stroke="#fff" stroke-width="2"/><line x1="-20" y1="0" x2="20" y2="0" stroke="#fff" stroke-width="1.5"/>${txt('TI', -6, '9px')}${txt('##', 8, '9px')}` },
      'isa_2': { cat: '9. Instrumentación ISA', name: 'Campo (Simple)', svg: `<circle cx="0" cy="0" r="20" fill="#161620" stroke="#fff" stroke-width="2"/>${txt('TI', 0, '10px')}` },
      'isa_3': { cat: '9. Instrumentación ISA', name: 'Campo (Punteado)', svg: `<circle cx="0" cy="0" r="20" fill="#161620" stroke="#fff" stroke-width="2"/><line x1="-20" y1="0" x2="20" y2="0" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,2"/>${txt('TI', -6, '9px')}${txt('##', 8, '9px')}` },

      'isa_17': { cat: '9. Instrumentación ISA', name: 'Rombo Solo (Div.)', svg: `<polygon points="0,-22 22,0 0,22 -22,0" fill="#161620" stroke="#38bdf8" stroke-width="2"/><line x1="-22" y1="0" x2="22" y2="0" stroke="#38bdf8" stroke-width="1.5"/>${txt('TI', -6, '9px', '#38bdf8')}${txt('##', 8, '9px')}` },
      'isa_18': { cat: '9. Instrumentación ISA', name: 'Rombo Solo (Simple)', svg: `<polygon points="0,-22 22,0 0,22 -22,0" fill="#161620" stroke="#38bdf8" stroke-width="2"/>${txt('TI', 0, '10px', '#38bdf8')}` },
      'isa_19': { cat: '9. Instrumentación ISA', name: 'Rombo Solo (Punt.)', svg: `<polygon points="0,-22 22,0 0,22 -22,0" fill="#161620" stroke="#38bdf8" stroke-width="2"/><line x1="-22" y1="0" x2="22" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>${txt('TI', -6, '9px', '#38bdf8')}${txt('##', 8, '9px')}` },
      'isa_20': { cat: '9. Instrumentación ISA', name: 'Rombo Solo (Doble)', svg: `<polygon points="0,-22 22,0 0,22 -22,0" fill="#161620" stroke="#38bdf8" stroke-width="2"/><line x1="-22" y1="-3" x2="22" y2="-3" stroke="#38bdf8" stroke-width="1.5"/><line x1="-22" y1="3" x2="22" y2="3" stroke="#38bdf8" stroke-width="1.5"/>${txt('TI', -7, '9px', '#38bdf8')}${txt('##', 10, '9px')}` },
      'isa_21': { cat: '9. Instrumentación ISA', name: 'Campo vástago (Div.)', svg: `<circle cx="0" cy="-10" r="16" fill="#161620" stroke="#fff" stroke-width="1.5"/><line x1="0" y1="6" x2="0" y2="28" stroke="#fff" stroke-width="2"/><line x1="-16" y1="-10" x2="16" y2="-10" stroke="#fff" stroke-width="1.2"/>${txt('TI', -15, '8px')}${txt('##', -4, '8px')}` },
      'isa_22': { cat: '9. Instrumentación ISA', name: 'Panel vástago (Cuad.)', svg: `<rect x="-16" y="-26" width="32" height="32" fill="#161620" stroke="#38bdf8" stroke-width="1.5"/><circle cx="0" cy="-10" r="13" fill="none" stroke="#38bdf8" stroke-width="1.2"/><line x1="0" y1="6" x2="0" y2="28" stroke="#fff" stroke-width="2"/><line x1="-16" y1="-10" x2="16" y2="-10" stroke="#38bdf8" stroke-width="1.2"/>${txt('TI', -15, '8px', '#38bdf8')}${txt('##', -4, '8px')}` },
      'isa_23': { cat: '9. Instrumentación ISA', name: 'Panel vástago (Hex.)', svg: `<polygon points="0,-23 15,-15 15,5 0,13 -15,5 -15,-15" fill="#161620" stroke="#38bdf8" stroke-width="1.5"/><line x1="0" y1="5" x2="0" y2="28" stroke="#fff" stroke-width="2"/><line x1="-15" y1="-5" x2="15" y2="-5" stroke="#38bdf8" stroke-width="1.2"/>${txt('TI', -10, '8px', '#38bdf8')}${txt('##', 1, '8px')}` },
      'isa_24': { cat: '9. Instrumentación ISA', name: 'Panel vástago (Rombo)', svg: `<rect x="-16" y="-26" width="32" height="32" fill="#161620" stroke="#38bdf8" stroke-width="1.5"/><polygon points="0,-21 15,-10 0,1 -15,-10" fill="none" stroke="#38bdf8" stroke-width="1.2"/><line x1="0" y1="6" x2="0" y2="28" stroke="#fff" stroke-width="2"/><line x1="-15" y1="-10" x2="15" y2="-10" stroke="#38bdf8" stroke-width="1.2"/>${txt('TI', -15, '8px', '#38bdf8')}${txt('##', -4, '8px')}` }
    };

    // GENERAR BARRA LATERAL CON MINIATURAS Y BÚSQUEDA EN VIVO
    function renderSidebar(filterText = '') {
      const categories = {};
      for (let key in componentLibrary) {
        const item = componentLibrary[key];
        if (filterText && !item.name.toLowerCase().includes(filterText.toLowerCase()) && !item.cat.toLowerCase().includes(filterText.toLowerCase())) {
          continue;
        }
        if (!categories[item.cat]) categories[item.cat] = [];
        categories[item.cat].push({ key, name: item.name, svg: item.svg });
      }

      let html = '';
      Object.keys(categories).sort().forEach(cat => {
        html += `<div class="category-box">
                   <div class="category-title">${cat.substring(3)}</div>
                   <div class="category-grid">`;
        categories[cat].forEach(item => {
          html += `<div class="item-card" onclick="addSymbol('${item.key}')" title="${item.name}">
                     <svg viewBox="-50 -50 100 100">${item.svg}</svg>
                     <span>${item.name}</span>
                   </div>`;
        });
        html += `</div></div>`;
      });
      sidebarScroll.innerHTML = html || '<p style="font-size:11px; color:#94a3b8; text-align:center; padding:20px;">No se encontraron componentes</p>';
    }

    function filterSidebar(val) { renderSidebar(val); }
    renderSidebar(); // Render inicial completo

    // --- LOGICA CORE DE LA APP ---
    const undoStack = []; const redoStack = [];
    function saveState() {
      undoStack.push({ symbols: symbolsLayer.innerHTML, pipes: pipesLayer.innerHTML });
      if (undoStack.length > 30) undoStack.shift(); redoStack.length = 0;
    }
    function undoAction() { if (undoStack.length === 0) return; redoStack.push({ symbols: symbolsLayer.innerHTML, pipes: pipesLayer.innerHTML }); restoreLayers(undoStack.pop()); }
    function redoAction() { if (redoStack.length === 0) return; undoStack.push({ symbols: symbolsLayer.innerHTML, pipes: pipesLayer.innerHTML }); restoreLayers(redoStack.pop()); }
    function restoreLayers(state) {
      clearSelection(); symbolsLayer.innerHTML = state.symbols; pipesLayer.innerHTML = state.pipes;
      symbolsLayer.querySelectorAll('.symbol-group').forEach(setupSymbolEvents); pipesLayer.querySelectorAll('.pipe-group').forEach(bindPipeGroupEvents);
    }
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redoAction() : undoAction(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redoAction(); }
      else if (e.key === 'Delete' || e.key === 'Backspace' || e.key === 'Supr') { if (selectedTarget && document.activeElement.tagName !== 'INPUT') deleteSelectedItem(); }
    });

    function getCoords(evt) {
      const rect = canvas.getBoundingClientRect(); const cx = evt.touches ? evt.touches[0].clientX : evt.clientX; const cy = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    function selectElement(elem) { if (selectedTarget && selectedTarget !== elem) selectedTarget.classList.remove('is-selected'); selectedTarget = elem; if (selectedTarget) selectedTarget.classList.add('is-selected'); }
    function clearSelection() { if (selectedTarget) { selectedTarget.classList.remove('is-selected'); selectedTarget = null; } }
    function deleteSelectedItem() { if (selectedTarget) { saveState(); selectedTarget.remove(); selectedTarget = null; } }
    canvas.addEventListener('mousedown', (e) => { if (e.target === canvas && !isPipeMode) clearSelection(); });
    function generateOrthogonalPath(x1, y1, x2, y2) { return `M ${x1} ${y1} L ${Math.round(x1 + (x2 - x1)/2)} ${y1} L ${Math.round(x1 + (x2 - x1)/2)} ${y2} L ${x2} ${y2}`; }

    // DIBUJAR COMPONENTE
    function addSymbol(type) {
      saveState();
      const rect = canvas.getBoundingClientRect(); const posX = rect.width ? rect.width / 2 : 350; const posY = rect.height ? rect.height / 2 : 300;
      const group = document.createElementNS(SVG_NS, 'g'); group.setAttribute('class', 'symbol-group'); group.setAttribute('data-type', type); group.setAttribute('transform', `translate(${posX}, ${posY})`);
      group.innerHTML = componentLibrary[type].svg;
      symbolsLayer.appendChild(group); setupSymbolEvents(group); selectElement(group);
    }

    function setupSymbolEvents(elem) {
      const handleStart = (e) => {
        if (isPipeMode) return; e.stopPropagation(); selectElement(elem); draggingElement = elem;
        const pos = getCoords(e); const match = /translate\(([^,]+),\s*([^)]+)\)/.exec(elem.getAttribute('transform'));
        offset = { x: pos.x - (match ? parseFloat(match[1]) : 0), y: pos.y - (match ? parseFloat(match[2]) : 0) };
      };
      elem.addEventListener('mousedown', handleStart); elem.addEventListener('touchstart', handleStart, { passive: false });
      elem.addEventListener('dblclick', (e) => {
        e.stopPropagation(); const texts = elem.querySelectorAll('text');
        if (texts.length > 0) {
          const currentText = Array.from(texts).map(t => t.textContent).join('-');
          const val = prompt('Editar textos (Formato: SUPERIOR-INFERIOR):', currentText);
          if (val !== null && val.trim() !== '') {
            saveState();
            const parts = val.split('-');
            if(parts.length > 0 && texts[0]) texts[0].textContent = parts[0].trim();
            if(parts.length > 1 && texts[1]) texts[1].textContent = parts[1].trim();
          }
        }
      });
      elem.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); if (confirm('¿Eliminar componente?')) { saveState(); if (selectedTarget === elem) selectedTarget = null; elem.remove(); } });
    }

    function handleMove(e) {
      const pos = getCoords(e);
      if (draggingElement && !isPipeMode) {
        e.preventDefault(); draggingElement.setAttribute('transform', `translate(${Math.round((pos.x - offset.x) / 10) * 10}, ${Math.round((pos.y - offset.y) / 10) * 10})`);
      } else if (activePipeGroup && isPipeMode && pipeStartPoint) {
        activePipeGroup.querySelectorAll('path.pipe-visible, path.pipe-hit-area').forEach(p => p.setAttribute('d', generateOrthogonalPath(pipeStartPoint.x, pipeStartPoint.y, pos.x, pos.y)));
      }
    }
    function handleEnd() { if (draggingElement) { saveState(); draggingElement = null; } }
    canvas.addEventListener('mousemove', handleMove); canvas.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('mouseup', handleEnd); window.addEventListener('touchend', handleEnd);

    // TUBERIAS Y SEÑALES
    function togglePipeMode() { isPipeMode = !isPipeMode; document.getElementById('pipe-btn').classList.toggle('active-mode', isPipeMode); document.getElementById('pipe-btn').textContent = isPipeMode ? 'Modo Trazado 90°' : 'Trazar Línea (90°)'; canvas.style.cursor = isPipeMode ? 'cell' : 'crosshair'; activePipeGroup = null; pipeStartPoint = null; clearSelection(); }
    function setPipeStyle(type) { pipeType = type; document.querySelectorAll('.btn-pipe-type').forEach(b => b.classList.remove('selected')); document.getElementById(`pipe-${type}`).classList.add('selected'); }
    function bindPipeGroupEvents(group) {
      group.addEventListener('mousedown', (evt) => { if (!isPipeMode) { evt.stopPropagation(); selectElement(group); }});
      group.addEventListener('contextmenu', (evt) => { evt.preventDefault(); evt.stopPropagation(); if (confirm('¿Eliminar tramo?')) { saveState(); if (selectedTarget === group) selectedTarget = null; group.remove(); } });
    }

    canvas.addEventListener('mousedown', (e) => {
      if (!isPipeMode || e.target.closest('.symbol-group')) return;
      const pos = getCoords(e);
      if (!activePipeGroup) {
        saveState(); pipeStartPoint = { x: pos.x, y: pos.y };
        activePipeGroup = document.createElementNS(SVG_NS, 'g'); activePipeGroup.setAttribute('class', 'pipe-group');
        const initialPath = generateOrthogonalPath(pos.x, pos.y, pos.x, pos.y);
        
        const hitArea = document.createElementNS(SVG_NS, 'path'); hitArea.setAttribute('class', 'pipe-hit-area'); hitArea.setAttribute('d', initialPath); hitArea.setAttribute('fill', 'none'); hitArea.setAttribute('stroke', 'transparent'); hitArea.setAttribute('stroke-width', '26'); hitArea.setAttribute('stroke-linejoin', 'round'); hitArea.setAttribute('cursor', 'pointer');
        const visPath = document.createElementNS(SVG_NS, 'path'); visPath.setAttribute('class', 'pipe-visible'); visPath.setAttribute('d', initialPath); visPath.setAttribute('fill', 'none'); visPath.setAttribute('stroke-linejoin', 'round'); visPath.setAttribute('cursor', 'pointer');
        
        if (pipeType === 'process') { visPath.setAttribute('stroke', '#38bdf8'); visPath.setAttribute('stroke-width', '3.5'); visPath.setAttribute('marker-end', 'url(#arrow)'); }
        else if (pipeType === 'secondary') { visPath.setAttribute('stroke', '#94a3b8'); visPath.setAttribute('stroke-width', '2'); }
        else if (pipeType === 'electric') { visPath.setAttribute('stroke', '#fbbf24'); visPath.setAttribute('stroke-width', '2'); visPath.setAttribute('stroke-dasharray', '6,4'); }
        else if (pipeType === 'pneumatic') { visPath.setAttribute('stroke', '#f87171'); visPath.setAttribute('stroke-width', '2'); visPath.setAttribute('stroke-dasharray', '14,4,2,4'); }
        else if (pipeType === 'hydraulic') { visPath.setAttribute('stroke', '#fb923c'); visPath.setAttribute('stroke-width', '2'); visPath.setAttribute('stroke-dasharray', '16,6,4,6'); }
        else if (pipeType === 'capillary') { visPath.setAttribute('stroke', '#e879f9'); visPath.setAttribute('stroke-width', '2'); visPath.setAttribute('stroke-dasharray', '10,4,2,4,2,4'); }
        else if (pipeType === 'data') { visPath.setAttribute('stroke', '#a78bfa'); visPath.setAttribute('stroke-width', '2'); visPath.setAttribute('stroke-dasharray', '8,6'); }
        else if (pipeType === 'wireless') { visPath.setAttribute('stroke', '#4ade80'); visPath.setAttribute('stroke-width', '2.5'); visPath.setAttribute('stroke-dasharray', '3,5'); }
        
        activePipeGroup.appendChild(visPath); activePipeGroup.appendChild(hitArea); pipesLayer.appendChild(activePipeGroup); bindPipeGroupEvents(activePipeGroup);
      } else { selectElement(activePipeGroup); activePipeGroup = null; pipeStartPoint = null; }
    });

    function clearCanvas() { if (confirm('¿Vaciar todo el diagrama?')) { saveState(); symbolsLayer.innerHTML = ''; pipesLayer.innerHTML = ''; activePipeGroup = null; selectedTarget = null; } }
    
    // LISTA DE MATERIALES (BOM)
    function generateBOM() {
      clearSelection(); const items = {};
      symbolsLayer.querySelectorAll('.symbol-group').forEach(el => {
        const type = el.getAttribute('data-type'); const name = componentLibrary[type] ? componentLibrary[type].name : 'Componente';
        const texts = Array.from(el.querySelectorAll('text')).map(t => t.textContent).filter(t => !['TI', '##'].includes(t));
        const tag = texts.length > 0 ? texts.join('-') : 'S/N';
        if (!items[name]) items[name] = { count: 0, tags: [] };
        items[name].count++; items[name].tags.push(tag);
      });
      const pipeCount = pipesLayer.querySelectorAll('.pipe-group').length;
      let html = `<div class="bom-modal" id="bom-modal-container"><div class="bom-content"><div class="bom-header"><h2>📋 Lista de Materiales (BOM)</h2><span class="close-bom" onclick="document.getElementById('bom-modal-container').remove()">&times;</span></div><div class="bom-table-container"><table class="bom-table"><thead><tr><th style="width: 10%; text-align: center;">Cant.</th><th style="width: 40%;">Componente</th><th style="width: 50%;">Tags</th></tr></thead><tbody>`;
      for(let key in items) html += `<tr><td style="text-align: center; font-weight: bold; color: #38bdf8;">${items[key].count}</td><td>${key}</td><td style="color: #94a3b8;">${items[key].tags.join(', ')}</td></tr>`;
      html += `<tr><td style="text-align: center; font-weight: bold; color: #38bdf8;">${pipeCount}</td><td>Tramos de Líneas / Tuberías</td><td style="color: #94a3b8;">-</td></tr></tbody></table></div></div></div>`;
      const div = document.createElement('div'); div.innerHTML = html; document.body.appendChild(div.firstElementChild);
    }

    // EXPORTACIÓN Y GUARDADO
    function exportSVG() {
      clearSelection(); const blob = new Blob([new XMLSerializer().serializeToString(canvas)], { type: 'image/svg+xml;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'diagrama.svg'; a.click();
    }
    function exportPNG() {
      clearSelection(); const img = new Image();
      img.onload = () => {
        const outCanvas = document.createElement('canvas'); outCanvas.width = canvas.clientWidth || 1600; outCanvas.height = canvas.clientHeight || 900;
        const ctx = outCanvas.getContext('2d'); ctx.fillStyle = '#121217'; ctx.fillRect(0, 0, outCanvas.width, outCanvas.height); ctx.drawImage(img, 0, 0);
        const a = document.createElement('a'); a.download = 'diagrama.png'; a.href = outCanvas.toDataURL('image/png'); a.click();
      };
      img.src = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(canvas)], { type: 'image/svg+xml;charset=utf-8' }));
    }
    function saveProjectJSON() {
      clearSelection(); const blob = new Blob([JSON.stringify({ version: "5.0", symbolsHTML: symbolsLayer.innerHTML, pipesHTML: pipesLayer.innerHTML }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'proyecto.json'; a.click();
    }
    function loadProjectJSON(event) {
      const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
      reader.onload = (e) => { try { const data = JSON.parse(e.target.result); if (data.symbolsHTML !== undefined) { saveState(); restoreLayers(data); } } catch (err) { alert('Error al leer JSON'); } };
      reader.readAsText(file); event.target.value = '';
    }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  </script>
