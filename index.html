<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>P&ID Studio Pro - ISA S5.1</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121217">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #121217;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1a1a24;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #2e2e40;
      z-index: 100;
      flex-wrap: wrap;
      gap: 6px;
    }

    .toolbar-group {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background-color: #282a3a;
      color: #e2e8f0;
      border: 1px solid #3f4259;
      padding: 5px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s;
    }

    button:hover {
      background-color: #3b3e57;
      border-color: #5d6287;
    }

    button:active {
      transform: scale(0.96);
    }

    button.active-mode {
      background-color: #10b981 !important;
      border-color: #059669 !important;
      color: #ffffff !important;
    }

    .btn-pipe-type {
      background-color: #181822;
      font-size: 11px;
    }

    .btn-pipe-type.selected {
      border-color: #38bdf8;
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-history {
      background-color: #334155;
      border-color: #475569;
    }

    .btn-project {
      background-color: #475569;
      border-color: #64748b;
    }

    .btn-delete-item {
      background-color: #e11d48;
      border-color: #be123c;
      color: #ffffff;
    }
    .btn-delete-item:hover {
      background-color: #be123c;
    }

    .btn-export {
      background-color: #2563eb;
      border-color: #1d4ed8;
      color: #ffffff;
    }

    .btn-danger {
      background-color: #7f1d1d;
      border-color: #991b1b;
      color: #fca5a5;
    }

    #main-layout {
      flex: 1;
      display: flex;
      height: calc(100vh - 52px);
      overflow: hidden;
    }

    #sidebar {
      width: 280px;
      background-color: #161620;
      border-right: 2px solid #2e2e40;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category-box {
      border: 1px solid #272738;
      border-radius: 6px;
      background-color: #1b1b26;
      padding: 8px;
    }

    .category-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: bold;
      border-bottom: 1px solid #2e2e40;
      padding-bottom: 4px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }

    .item-btn {
      background-color: #222333;
      border: 1px solid #33354d;
      color: #cbd5e1;
      padding: 7px 4px;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
      cursor: pointer;
      line-height: 1.2;
    }

    .item-btn:hover {
      background-color: #3b82f6;
      border-color: #60a5fa;
      color: #ffffff;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      background-color: #121217;
      background-image: radial-gradient(#2b2b3d 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      overflow: hidden;
    }

    svg#pid-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .symbol-group {
      cursor: move;
    }

    .pipe-group {
      cursor: pointer;
    }

    .symbol-group.is-selected {
      outline: 2px dashed #facc15 !important;
      outline-offset: 4px;
    }
    
    .pipe-group.is-selected .pipe-visible {
      stroke: #facc15 !important;
      stroke-width: 4.5px !important;
      marker-end: url(#arrow-selected) !important;
    }
    .pipe-group.is-selected text {
      fill: #facc15 !important;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header>
    <div class="toolbar-group">
      <!-- HISTORIAL -->
      <button class="btn-history" onclick="undoAction()" title="Deshacer (Ctrl + Z)">↶ Deshacer</button>
      <button class="btn-history" onclick="redoAction()" title="Rehacer (Ctrl + Y)">↷ Rehacer</button>

      <!-- TRAZADO ORTOGONAL -->
      <button id="pipe-btn" onclick="togglePipeMode()">Trazar Trazo (90°)</button>
      <span style="font-size: 11px; color:#94a3b8;">Tipo:</span>
      <button id="pipe-process" class="btn-pipe-type selected" onclick="setPipeStyle('process')">Tubería Principal</button>
      <button id="pipe-secondary" class="btn-pipe-type" onclick="setPipeStyle('secondary')">Tubería Auxiliar</button>
      <button id="pipe-electric" class="btn-pipe-type" onclick="setPipeStyle('electric')">Eléctrica (---)</button>
      <button id="pipe-pneumatic" class="btn-pipe-type" onclick="setPipeStyle('pneumatic')">Neumática (//)</button>
      <button id="pipe-hydraulic" class="btn-pipe-type" onclick="setPipeStyle('hydraulic')">Hidráulica (-T-)</button>
      <button id="pipe-data" class="btn-pipe-type" onclick="setPipeStyle('data')">Bus Datos (-o-)</button>
      
      <!-- EDICIÓN -->
      <button class="btn-delete-item" onclick="deleteSelectedItem()" title="Eliminar seleccionado (o tecla Supr / Delete)">✕ Eliminar</button>
      <button class="btn-danger" onclick="clearCanvas()">Limpiar</button>
    </div>

    <!-- PROYECTO Y EXPORTACIÓN -->
    <div class="toolbar-group">
      <button class="btn-project" onclick="saveProjectJSON()">💾 Guardar JSON</button>
      <button class="btn-project" onclick="document.getElementById('load-json-input').click()">📂 Cargar JSON</button>
      <input type="file" id="load-json-input" style="display: none;" accept=".json" onchange="loadProjectJSON(event)">
      <button class="btn-export" onclick="exportSVG()">Exportar SVG</button>
      <button class="btn-export" onclick="exportPNG()">Exportar PNG</button>
    </div>
  </header>

  <!-- CUERPO PRINCIPAL -->
  <div id="main-layout">
    
    <aside id="sidebar">
      <!-- 1. EQUIPOS DE PROCESO -->
      <div class="category-box">
        <div class="category-title">Equipos de Proceso</div>
        <div class="category-grid">
          <button class="item-btn" onclick="addSymbol('tank_vertical')">Estanque Vertical</button>
          <button class="item-btn" onclick="addSymbol('tank_horizontal')">Estanque Horizontal</button>
          <button class="item-btn" onclick="addSymbol('tank_jacket')">Tanque Enchaquetado</button>
          <button class="item-btn" onclick="addSymbol('heat_exchanger')">Intercambiador Calor</button>
          <button class="item-btn" onclick="addSymbol('dest_tower')">Torre Destilación</button>
          <button class="item-btn" onclick="addSymbol('furnace')">Horno / Caldera</button>
          <button class="item-btn" onclick="addSymbol('cyclone')">Ciclón Separador</button>
          <button class="item-btn" onclick="addSymbol('silo')">Tolva / Silo</button>
        </div>
      </div>

      <!-- 2. MAQUINARIA Y ACCIONAMIENTOS -->
      <div class="category-box">
        <div class="category-title">Bombas y Motores</div>
        <div class="category-grid">
          <button class="item-btn" onclick="addSymbol('pump_centrifugal')">Bomba Centrífuga</button>
          <button class="item-btn" onclick="addSymbol('pump_positive')">Desplaz. Positivo</button>
          <button class="item-btn" onclick="addSymbol('compressor')">Compresor</button>
          <button class="item-btn" onclick="addSymbol('motor_electric')">Motor Eléctrico</button>
          <button class="item-btn" onclick="addSymbol('agitator')">Agitador / Mezclador</button>
          <button class="item-btn" onclick="addSymbol('conveyor')">Banda Transportadora</button>
        </div>
      </div>

      <!-- 3. SENSORES Y ELEMENTOS PRIMARIOS -->
      <div class="category-box">
        <div class="category-title">Sensores y Elementos Primarios</div>
        <div class="category-grid">
          <button class="item-btn" onclick="addSymbol('elem_orifice')">Placa Orificio (FE)</button>
          <button class="item-btn" onclick="addSymbol('elem_venturi')">Tubo Venturi (FE)</button>
          <button class="item-btn" onclick="addSymbol('elem_rotameter')">Rotámetro (FI)</button>
          <button class="item-btn" onclick="addSymbol('elem_thermowell')">Termopozo / RTD (TE)</button>
          <button class="item-btn" onclick="addSymbol('elem_gauge')">Manómetro Local (PG)</button>
          <button class="item-btn" onclick="addSymbol('elem_level_glass')">Mirilla Nivel (LG)</button>
          <button class="item-btn" onclick="addSymbol('elem_steam_trap')">Trampa de Vapor</button>
          <button class="item-btn" onclick="addSymbol('elem_rupture_disc')">Disco Ruptura (PSE)</button>
        </div>
      </div>

      <!-- 4. VÁLVULAS Y ACTUADORES -->
      <div class="category-box">
        <div class="category-title">Válvulas y Actuadores</div>
        <div class="category-grid">
          <button class="item-btn" onclick="addSymbol('valve_gate')">Válvula Manual</button>
          <button class="item-btn" onclick="addSymbol('valve_check')">Válvula Check</button>
          <button class="item-btn" onclick="addSymbol('valve_control_diaph')">Válvula Diafragma</button>
          <button class="item-btn" onclick="addSymbol('valve_solenoid')">Electroválvula (S)</button>
          <button class="item-btn" onclick="addSymbol('valve_3way')">Válvula 3 Vías</button>
          <button class="item-btn" onclick="addSymbol('valve_relief')">Válvula Alivio (PSV)</button>
          <button class="item-btn" onclick="addSymbol('act_piston')">Actuador Cilindro</button>
          <button class="item-btn" onclick="addSymbol('valve_butterfly')">Válvula Mariposa</button>
        </div>
      </div>

      <!-- 5. INSTRUMENTACIÓN Y RELÉS ISA -->
      <div class="category-box">
        <div class="category-title">Instrumentación y Relés ISA</div>
        <div class="category-grid">
          <button class="item-btn" onclick="addSymbol('inst_field')">Instrumento Campo</button>
          <button class="item-btn" onclick="addSymbol('inst_panel')">Instrumento Panel</button>
          <button class="item-btn" onclick="addSymbol('inst_plc')">Bloque PLC / DCS</button>
          <button class="item-btn" onclick="addSymbol('relay_sqrt')">Relé Raíz (FY √)</button>
          <button class="item-btn" onclick="addSymbol('relay_sum')">Relé Sumador (FY Σ)</button>
          <button class="item-btn" onclick="addSymbol('relay_ip')">Convertidor (FY I/P)</button>
          <button class="item-btn" onclick="addSymbol('relay_mult')">Relé Razón (FY A/B)</button>
          <button class="item-btn" onclick="addSymbol('inst_switch')">Switch Alarma (LSH)</button>
        </div>
      </div>
    </aside>

    <!-- LIENZO SVG -->
    <main id="canvas-container">
      <svg id="pid-canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
          </marker>
          <marker id="arrow-selected" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15" />
          </marker>
        </defs>
        <g id="pipes-layer"></g>
        <g id="symbols-layer"></g>
      </svg>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('pid-canvas');
    const symbolsLayer = document.getElementById('symbols-layer');
    const pipesLayer = document.getElementById('pipes-layer');
    const pipeBtn = document.getElementById('pipe-btn');

    const SVG_NS = "http://www.w3.org/2000/svg";
    let isPipeMode = false;
    let pipeType = 'process';
    let pipeStartPoint = null;
    let activePipeGroup = null;
    let draggingElement = null;
    let selectedTarget = null;
    let offset = { x: 0, y: 0 };

    // HISTORIAL DESHACER / REHACER
    const undoStack = [];
    const redoStack = [];

    function saveState() {
      const state = {
        symbols: symbolsLayer.innerHTML,
        pipes: pipesLayer.innerHTML
      };
      undoStack.push(state);
      if (undoStack.length > 30) undoStack.shift();
      redoStack.length = 0; // Limpiar rehacer
    }

    function undoAction() {
      if (undoStack.length === 0) return;
      const currentState = {
        symbols: symbolsLayer.innerHTML,
        pipes: pipesLayer.innerHTML
      };
      redoStack.push(currentState);
      const prevState = undoStack.pop();
      restoreLayers(prevState);
    }

    function redoAction() {
      if (redoStack.length === 0) return;
      const currentState = {
        symbols: symbolsLayer.innerHTML,
        pipes: pipesLayer.innerHTML
      };
      undoStack.push(currentState);
      const nextState = redoStack.pop();
      restoreLayers(nextState);
    }

    function restoreLayers(state) {
      clearSelection();
      symbolsLayer.innerHTML = state.symbols;
      pipesLayer.innerHTML = state.pipes;
      // Re-vincular eventos a todos los elementos restaurados
      symbolsLayer.querySelectorAll('.symbol-group').forEach(setupSymbolEvents);
      pipesLayer.querySelectorAll('.pipe-group').forEach(bindPipeGroupEvents);
    }

    // Atajos de teclado para Undo/Redo y Delete
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) redoAction();
        else undoAction();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault();
        redoAction();
      } else if (e.key === 'Delete' || e.key === 'Backspace' || e.key === 'Supr') {
        if (selectedTarget && document.activeElement.tagName !== 'INPUT') {
          deleteSelectedItem();
        }
      }
    });

    function getCoords(evt) {
      const rect = canvas.getBoundingClientRect();
      const cx = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const cy = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    function createSVGText(text, x, y, fill = "#ffffff", size = "11px", weight = "normal") {
      const el = document.createElementNS(SVG_NS, 'text');
      el.setAttribute('x', x);
      el.setAttribute('y', y);
      el.setAttribute('fill', fill);
      el.setAttribute('font-size', size);
      el.setAttribute('font-weight', weight);
      el.setAttribute('text-anchor', 'middle');
      el.setAttribute('dominant-baseline', 'central');
      el.setAttribute('font-family', 'sans-serif');
      el.textContent = text;
      return el;
    }

    // SELECCIÓN Y BORRADO
    function selectElement(elem) {
      if (selectedTarget && selectedTarget !== elem) {
        selectedTarget.classList.remove('is-selected');
      }
      selectedTarget = elem;
      if (selectedTarget) {
        selectedTarget.classList.add('is-selected');
      }
    }

    function clearSelection() {
      if (selectedTarget) {
        selectedTarget.classList.remove('is-selected');
        selectedTarget = null;
      }
    }

    function deleteSelectedItem() {
      if (selectedTarget) {
        saveState();
        selectedTarget.remove();
        selectedTarget = null;
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      if (e.target === canvas && !isPipeMode) {
        clearSelection();
      }
    });

    // GENERADOR DE RUTA ORTOGONAL (90°)
    function generateOrthogonalPath(x1, y1, x2, y2) {
      const midX = Math.round(x1 + (x2 - x1) / 2);
      return `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`;
    }

    // CATÁLOGO DE SÍMBOLOS
    function addSymbol(type) {
      saveState();
      const rect = canvas.getBoundingClientRect();
      const posX = rect.width ? rect.width / 2 : 320;
      const posY = rect.height ? rect.height / 2 : 260;

      const group = document.createElementNS(SVG_NS, 'g');
      group.setAttribute('class', 'symbol-group');
      group.setAttribute('transform', `translate(${posX}, ${posY})`);

      // 1. EQUIPOS
      if (type === 'tank_vertical') {
        const body = document.createElementNS(SVG_NS, 'rect');
        body.setAttribute('x', '-40'); body.setAttribute('y', '-60');
        body.setAttribute('width', '80'); body.setAttribute('height', '120');
        body.setAttribute('rx', '15'); body.setAttribute('fill', '#202230');
        body.setAttribute('stroke', '#ffffff'); body.setAttribute('stroke-width', '2.5');
        group.appendChild(body);
        group.appendChild(createSVGText('TK-101', 0, 0, '#ffffff', '12px', 'bold'));
      }
      else if (type === 'tank_horizontal') {
        const body = document.createElementNS(SVG_NS, 'rect');
        body.setAttribute('x', '-65'); body.setAttribute('y', '-35');
        body.setAttribute('width', '130'); body.setAttribute('height', '70');
        body.setAttribute('rx', '18'); body.setAttribute('fill', '#202230');
        body.setAttribute('stroke', '#ffffff'); body.setAttribute('stroke-width', '2.5');
        group.appendChild(body);
        group.appendChild(createSVGText('TK-102', 0, 0, '#ffffff', '12px', 'bold'));
      }
      else if (type === 'tank_jacket') {
        const outer = document.createElementNS(SVG_NS, 'rect');
        outer.setAttribute('x', '-48'); outer.setAttribute('y', '-40');
        outer.setAttribute('width', '96'); outer.setAttribute('height', '90');
        outer.setAttribute('rx', '12'); outer.setAttribute('fill', '#2d3148');
        outer.setAttribute('stroke', '#38bdf8'); outer.setAttribute('stroke-width', '2');
        const inner = document.createElementNS(SVG_NS, 'rect');
        inner.setAttribute('x', '-38'); inner.setAttribute('y', '-55');
        inner.setAttribute('width', '76'); inner.setAttribute('height', '110');
        inner.setAttribute('rx', '10'); inner.setAttribute('fill', '#202230');
        inner.setAttribute('stroke', '#ffffff'); inner.setAttribute('stroke-width', '2.5');
        group.appendChild(outer); group.appendChild(inner);
        group.appendChild(createSVGText('REACTOR', 0, 0, '#ffffff', '11px', 'bold'));
      }
      else if (type === 'heat_exchanger') {
        const body = document.createElementNS(SVG_NS, 'rect');
        body.setAttribute('x', '-50'); body.setAttribute('y', '-25');
        body.setAttribute('width', '100'); body.setAttribute('height', '50');
        body.setAttribute('rx', '12'); body.setAttribute('fill', '#202230');
        body.setAttribute('stroke', '#ffffff'); body.setAttribute('stroke-width', '2.5');
        const wave = document.createElementNS(SVG_NS, 'path');
        wave.setAttribute('d', 'M -40 0 C -20 -20, -20 20, 0 0 C 20 -20, 20 20, 40 0');
        wave.setAttribute('fill', 'none'); wave.setAttribute('stroke', '#38bdf8'); wave.setAttribute('stroke-width', '2.5');
        group.appendChild(body); group.appendChild(wave);
        group.appendChild(createSVGText('E-101', 0, 38, '#ffffff', '11px', 'bold'));
      }
      else if (type === 'dest_tower') {
        const col = document.createElementNS(SVG_NS, 'rect');
        col.setAttribute('x', '-25'); col.setAttribute('y', '-75');
        col.setAttribute('width', '50'); col.setAttribute('height', '150');
        col.setAttribute('rx', '14'); col.setAttribute('fill', '#202230');
        col.setAttribute('stroke', '#ffffff'); col.setAttribute('stroke-width', '2.5');
        group.appendChild(col);
        for(let i = -45; i <= 45; i += 30) {
          const tray = document.createElementNS(SVG_NS, 'line');
          tray.setAttribute('x1', '-20'); tray.setAttribute('y1', i);
          tray.setAttribute('x2', '20'); tray.setAttribute('y2', i);
          tray.setAttribute('stroke', '#94a3b8'); tray.setAttribute('stroke-width', '2');
          group.appendChild(tray);
        }
        group.appendChild(createSVGText('T-101', 0, 0, '#ffffff', '11px', 'bold'));
      }
      else if (type === 'furnace') {
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', 'M -35 50 L -35 10 L -15 -20 L -15 -60 L 15 -60 L 15 -20 L 35 10 L 35 50 Z');
        path.setAttribute('fill', '#202230'); path.setAttribute('stroke', '#ffffff'); path.setAttribute('stroke-width', '2.5');
        group.appendChild(path);
        group.appendChild(createSVGText('HORNO', 0, 20, '#ffffff', '10px', 'bold'));
      }
      else if (type === 'cyclone') {
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', 'M -30 -40 L 30 -40 L 30 0 L 0 45 L -30 0 Z');
        path.setAttribute('fill', '#202230'); path.setAttribute('stroke', '#ffffff'); path.setAttribute('stroke-width', '2.5');
        group.appendChild(path);
        group.appendChild(createSVGText('S-101', 0, -10, '#ffffff', '11px', 'bold'));
      }
      else if (type === 'silo') {
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', 'M -35 -40 L 35 -40 L 35 15 L 12 50 L -12 50 L -35 15 Z');
        path.setAttribute('fill', '#202230'); path.setAttribute('stroke', '#ffffff'); path.setAttribute('stroke-width', '2.5');
        group.appendChild(path);
        group.appendChild(createSVGText('SILO', 0, -5, '#ffffff', '11px', 'bold'));
      }

      // 2. BOMBAS Y ACCIONAMIENTOS
      else if (type === 'pump_centrifugal') {
        const circle = document.createElementNS(SVG_NS, 'circle');
        circle.setAttribute('cx', '0'); circle.setAttribute('cy', '0'); circle.setAttribute('r', '25');
        circle.setAttribute('fill', '#202230'); circle.setAttribute('stroke', '#ffffff'); circle.setAttribute('stroke-width', '2.5');
        const imp = document.createElementNS(SVG_NS, 'path');
        imp.setAttribute('d', 'M 0 -25 L 25 15 L -25 15 Z');
        imp.setAttribute('fill', '#384260'); imp.setAttribute('stroke', '#ffffff'); imp.setAttribute('stroke-width', '2');
        group.appendChild(circle); group.appendChild(imp);
        group.appendChild(createSVGText('P-101', 0, 40, '#ffffff', '11px', 'bold'));
      }
      else if (type === 'pump_positive') {
        const circle = document.createElementNS(SVG_NS, 'circle');
        circle.setAttribute('cx', '0'); circle.setAttribute('cy', '0'); circle.setAttribute('r', '25');
        circle.setAttribute('fill', '#202230'); circle.setAttribute('stroke', '#ffffff'); circle.setAttribute('stroke-width', '2.5');
        const d1 = document.createElementNS(SVG_NS, 'polygon');
        d1.setAttribute('points', '0,-20 20,0 0,20 -20,0');
        d1.setAttribute('fill', '#384260'); d1.setAttribute('stroke', '#ffffff'); d1.setAttribute('stroke-width', '2');
        group.appendChild(circle); group.appendChild(d1);
        group.appendChild(createSVGText('P-DP', 0, 40, '#ffffff', '11px', 'bold'));
      }

    function setupSymbolEvents(elem) {
      const handleStart = (e) => {
        if (isPipeMode) return;
        e.stopPropagation();
        selectElement(elem);
        draggingElement = elem;
        const pos = getCoords(e);
        const transform = elem.getAttribute('transform');
        const match = /translate\(([^,]+),\s*([^)]+)\)/.exec(transform);
        const currX = match ? parseFloat(match[1]) : 0;
        const currY = match ? parseFloat(match[2]) : 0;
        offset = { x: pos.x - currX, y: pos.y - currY };
      };

      elem.addEventListener('mousedown', handleStart);
      elem.addEventListener('touchstart', handleStart, { passive: false });

      elem.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        const texts = elem.querySelectorAll('text');
        if (texts.length > 0) {
          const val = prompt('Editar texto / tag:', texts[0].textContent);
          if (val !== null && val.trim() !== '') {
            saveState();
            texts[0].textContent = val.trim();
          }
        }
      });

      elem.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (confirm('¿Eliminar este componente?')) {
          saveState();
          if (selectedTarget === elem) selectedTarget = null;
          elem.remove();
        }
      });
    }

    function handleMove(e) {
      const pos = getCoords(e);
      if (draggingElement && !isPipeMode) {
        e.preventDefault();
        const nx = Math.round((pos.x - offset.x) / 10) * 10;
        const ny = Math.round((pos.y - offset.y) / 10) * 10;
        draggingElement.setAttribute('transform', `translate(${nx}, ${ny})`);
      } else if (activePipeGroup && isPipeMode && pipeStartPoint) {
        const pathData = generateOrthogonalPath(pipeStartPoint.x, pipeStartPoint.y, pos.x, pos.y);
        const paths = activePipeGroup.querySelectorAll('path');
        paths.forEach(p => p.setAttribute('d', pathData));
      }
    }

    function handleEnd() {
      if (draggingElement) {
        saveState();
        draggingElement = null;
      }
    }

    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchend', handleEnd);

    function togglePipeMode() {
      isPipeMode = !isPipeMode;
      pipeBtn.classList.toggle('active-mode', isPipeMode);
      pipeBtn.textContent = isPipeMode ? 'Modo Trazado 90° (Activo)' : 'Trazar Trazo (90°)';
      canvas.style.cursor = isPipeMode ? 'cell' : 'crosshair';
      activePipeGroup = null;
      pipeStartPoint = null;
      clearSelection();
    }

    function setPipeStyle(type) {
      pipeType = type;
      document.querySelectorAll('.btn-pipe-type').forEach(b => b.classList.remove('selected'));
      document.getElementById(`pipe-${type}`).classList.add('selected');
    }

    function bindPipeGroupEvents(group) {
      group.addEventListener('mousedown', (evt) => {
        if (!isPipeMode) {
          evt.stopPropagation();
          selectElement(group);
        }
      });

      group.addEventListener('contextmenu', (evt) => {
        evt.preventDefault();
        evt.stopPropagation();
        if (confirm('¿Eliminar este tramo completo de tubería/línea?')) {
          saveState();
          if (selectedTarget === group) selectedTarget = null;
          group.remove();
        }
      });
    }

    // TRAZADO ORTOGONAL DE LÍNEAS
    canvas.addEventListener('mousedown', (e) => {
      if (!isPipeMode || e.target.closest('.symbol-group')) return;
      const pos = getCoords(e);

      if (!activePipeGroup) {
        saveState();
        pipeStartPoint = { x: pos.x, y: pos.y };
        activePipeGroup = document.createElementNS(SVG_NS, 'g');
        activePipeGroup.setAttribute('class', 'pipe-group');

        const initialPath = generateOrthogonalPath(pos.x, pos.y, pos.x, pos.y);

        // Trazo invisible de selección
        const hitArea = document.createElementNS(SVG_NS, 'path');
        hitArea.setAttribute('class', 'pipe-hit-area');
        hitArea.setAttribute('d', initialPath);
        hitArea.setAttribute('fill', 'none');
        hitArea.setAttribute('stroke', 'transparent');
        hitArea.setAttribute('stroke-width', '26');
        hitArea.setAttribute('stroke-linejoin', 'round');
        hitArea.setAttribute('cursor', 'pointer');

        // Trazo visible
        const visPath = document.createElementNS(SVG_NS, 'path');
        visPath.setAttribute('class', 'pipe-visible');
        visPath.setAttribute('d', initialPath);
        visPath.setAttribute('fill', 'none');
        visPath.setAttribute('stroke-linejoin', 'round');
        visPath.setAttribute('cursor', 'pointer');

        if (pipeType === 'process') {
          visPath.setAttribute('stroke', '#38bdf8');
          visPath.setAttribute('stroke-width', '3.5');
          visPath.setAttribute('marker-end', 'url(#arrow)');
        } else if (pipeType === 'secondary') {
          visPath.setAttribute('stroke', '#94a3b8');
          visPath.setAttribute('stroke-width', '2');
        } else if (pipeType === 'electric') {
          visPath.setAttribute('stroke', '#fbbf24');
          visPath.setAttribute('stroke-width', '2');
          visPath.setAttribute('stroke-dasharray', '6,4');
        } else if (pipeType === 'pneumatic') {
          visPath.setAttribute('stroke', '#f87171');
          visPath.setAttribute('stroke-width', '2');
          visPath.setAttribute('stroke-dasharray', '14,4,2,4');
        } else if (pipeType === 'hydraulic') {
          visPath.setAttribute('stroke', '#fb923c');
          visPath.setAttribute('stroke-width', '2');
          visPath.setAttribute('stroke-dasharray', '16,6,4,6');
        } else if (pipeType === 'data') {
          visPath.setAttribute('stroke', '#a78bfa');
          visPath.setAttribute('stroke-width', '2');
          visPath.setAttribute('stroke-dasharray', '8,6');
        }

        activePipeGroup.appendChild(visPath);
        activePipeGroup.appendChild(hitArea);
        pipesLayer.appendChild(activePipeGroup);

        bindPipeGroupEvents(activePipeGroup);

      } else {
        // Fijar el final
        selectElement(activePipeGroup);
        activePipeGroup = null;
        pipeStartPoint = null;
      }
    });

    function clearCanvas() {
      if (confirm('¿Deseas vaciar todo el diagrama?')) {
        saveState();
        symbolsLayer.innerHTML = '';
        pipesLayer.innerHTML = '';
        activePipeGroup = null;
        selectedTarget = null;
      }
    }

    // GUARDAR Y CARGAR PROYECTO (JSON LOCAL)
    function saveProjectJSON() {
      clearSelection();
      const projectData = {
        version: "1.0",
        date: new Date().toISOString(),
        symbolsHTML: symbolsLayer.innerHTML,
        pipesHTML: pipesLayer.innerHTML
      };

      const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'proyecto-pid.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function loadProjectJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.symbolsHTML !== undefined && data.pipesHTML !== undefined) {
            saveState();
            restoreLayers({
              symbols: data.symbolsHTML,
              pipes: data.pipesHTML
            });
            alert('¡Proyecto cargado exitosamente!');
          } else {
            alert('Formato de archivo JSON no válido para P&ID Studio.');
          }
        } catch (err) {
          alert('Error al leer el archivo JSON: ' + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = ''; // Reset input
    }

    function exportSVG() {
      clearSelection();
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(canvas);
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'diagrama-isa-pid.svg';
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportPNG() {
      clearSelection();
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(canvas);
      const img = new Image();
      const svgBlob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      img.onload = () => {
        const outCanvas = document.createElement('canvas');
        outCanvas.width = canvas.clientWidth || 1400;
        outCanvas.height = canvas.clientHeight || 900;
        const ctx = outCanvas.getContext('2d');
        ctx.fillStyle = '#121217';
        ctx.fillRect(0, 0, outCanvas.width, outCanvas.height);
        ctx.drawImage(img, 0, 0);

        const a = document.createElement('a');
        a.download = 'diagrama-isa-pid.png';
        a.href = outCanvas.toDataURL('image/png');
        a.click();
        URL.revokeObjectURL(url);
      };
      img.src = url;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
