<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>P&ID Studio Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e24">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #121217;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1f1f2e;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 2px solid #33334d;
      z-index: 100;
    }

    .toolbar-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      background-color: #2e3047;
      color: #ffffff;
      border: 1px solid #4a4d70;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #3f4263;
      border-color: #6c71a3;
    }

    button:active {
      transform: scale(0.96);
    }

    button.active-mode {
      background-color: #10b981 !important;
      border-color: #059669 !important;
      color: #ffffff !important;
    }

    .btn-export {
      background-color: #3b82f6;
      border-color: #2563eb;
    }

    .btn-export:hover {
      background-color: #2563eb;
    }

    .btn-danger {
      background-color: #ef4444;
      border-color: #dc2626;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    #canvas-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
      background-color: #181820;
      background-image: radial-gradient(#33334d 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      overflow: hidden;
    }

    svg#pid-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .symbol-group {
      cursor: move;
    }

    .symbol-group:hover rect,
    .symbol-group:hover circle,
    .symbol-group:hover path {
      stroke: #38bdf8 !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="toolbar-group">
      <button onclick="addSymbol('tank')">+ Estanque</button>
      <button onclick="addSymbol('pump')">+ Bomba</button>
      <button onclick="addSymbol('valve')">+ Válvula</button>
      <button onclick="addSymbol('instrument')">+ Instrumento ISA</button>
      <button id="pipe-btn" onclick="togglePipeMode()">Trazar Tubería</button>
      <button class="btn-danger" onclick="clearCanvas()">Limpiar</button>
    </div>
    <div class="toolbar-group">
      <button class="btn-export" onclick="exportSVG()">Exportar SVG</button>
      <button class="btn-export" onclick="exportPNG()">Exportar PNG</button>
    </div>
  </header>

  <div id="canvas-container">
    <svg id="pid-canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
        </marker>
      </defs>
      <g id="pipes-layer"></g>
      <g id="symbols-layer"></g>
    </svg>
  </div>

  <script>
    const canvas = document.getElementById('pid-canvas');
    const symbolsLayer = document.getElementById('symbols-layer');
    const pipesLayer = document.getElementById('pipes-layer');
    const pipeBtn = document.getElementById('pipe-btn');

    const SVG_NS = "http://www.w3.org/2000/svg";
    let isPipeMode = false;
    let activePipe = null;
    let selectedElement = null;
    let offset = { x: 0, y: 0 };

    function getCoords(evt) {
      const rect = canvas.getBoundingClientRect();
      const cx = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const cy = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return {
        x: cx - rect.left,
        y: cy - rect.top
      };
    }

    function createSVGText(text, x, y, fill = "#ffffff", size = "12px", weight = "normal") {
      const el = document.createElementNS(SVG_NS, 'text');
      el.setAttribute('x', x);
      el.setAttribute('y', y);
      el.setAttribute('fill', fill);
      el.setAttribute('font-size', size);
      el.setAttribute('font-weight', weight);
      el.setAttribute('text-anchor', 'middle');
      el.setAttribute('font-family', 'sans-serif');
      el.textContent = text;
      return el;
    }

    function addSymbol(type) {
      const rect = canvas.getBoundingClientRect();
      const posX = rect.width ? rect.width / 2 : 250;
      const posY = rect.height ? rect.height / 2 : 250;

      const group = document.createElementNS(SVG_NS, 'g');
      group.setAttribute('class', 'symbol-group');
      group.setAttribute('transform', `translate(${posX}, ${posY})`);

      if (type === 'tank') {
        const body = document.createElementNS(SVG_NS, 'rect');
        body.setAttribute('x', '-35');
        body.setAttribute('y', '-55');
        body.setAttribute('width', '70');
        body.setAttribute('height', '110');
        body.setAttribute('rx', '14');
        body.setAttribute('fill', '#262938');
        body.setAttribute('stroke', '#ffffff');
        body.setAttribute('stroke-width', '2.5');

        const tag = createSVGText('TK-101', 0, 5, '#ffffff', '12px', 'bold');
        group.appendChild(body);
        group.appendChild(tag);
      } 
      else if (type === 'pump') {
        const circle = document.createElementNS(SVG_NS, 'circle');
        circle.setAttribute('cx', '0');
        circle.setAttribute('cy', '0');
        circle.setAttribute('r', '26');
        circle.setAttribute('fill', '#262938');
        circle.setAttribute('stroke', '#ffffff');
        circle.setAttribute('stroke-width', '2.5');

        const imp = document.createElementNS(SVG_NS, 'path');
        imp.setAttribute('d', 'M 0 -26 L 26 15 L -26 15 Z');
        imp.setAttribute('fill', '#3f4263');
        imp.setAttribute('stroke', '#ffffff');
        imp.setAttribute('stroke-width', '2');

        const tag = createSVGText('P-101', 0, 44, '#ffffff', '12px', 'bold');
        group.appendChild(circle);
        group.appendChild(imp);
        group.appendChild(tag);
      } 
      else if (type === 'valve') {
        const valveBody = document.createElementNS(SVG_NS, 'path');
        valveBody.setAttribute('d', 'M -25 -14 L 0 0 L -25 14 Z M 25 -14 L 0 0 L 25 14 Z');
        valveBody.setAttribute('fill', '#3f4263');
        valveBody.setAttribute('stroke', '#ffffff');
        valveBody.setAttribute('stroke-width', '2.5');

        const stem = document.createElementNS(SVG_NS, 'line');
        stem.setAttribute('x1', '0');
        stem.setAttribute('y1', '0');
        stem.setAttribute('x2', '0');
        stem.setAttribute('y2', '-18');
        stem.setAttribute('stroke', '#ffffff');
        stem.setAttribute('stroke-width', '2.5');

        const handle = document.createElementNS(SVG_NS, 'line');
        handle.setAttribute('x1', '-10');
        handle.setAttribute('y1', '-18');
        handle.setAttribute('x2', '10');
        handle.setAttribute('y2', '-18');
        handle.setAttribute('stroke', '#ffffff');
        handle.setAttribute('stroke-width', '2.5');

        const tag = createSVGText('V-101', 0, 32, '#ffffff', '11px', 'bold');
        group.appendChild(valveBody);
        group.appendChild(stem);
        group.appendChild(handle);
        group.appendChild(tag);
      } 
      else if (type === 'instrument') {
        const circle = document.createElementNS(SVG_NS, 'circle');
        circle.setAttribute('cx', '0');
        circle.setAttribute('cy', '0');
        circle.setAttribute('r', '24');
        circle.setAttribute('fill', '#1f1f2e');
        circle.setAttribute('stroke', '#38bdf8');
        circle.setAttribute('stroke-width', '2.5');

        const line = document.createElementNS(SVG_NS, 'line');
        line.setAttribute('x1', '-24');
        line.setAttribute('y1', '0');
        line.setAttribute('x2', '24');
        line.setAttribute('y2', '0');
        line.setAttribute('stroke', '#38bdf8');
        line.setAttribute('stroke-width', '1.5');

        const varText = createSVGText('LT', 0, -6, '#38bdf8', '12px', 'bold');
        const numText = createSVGText('101', 0, 15, '#ffffff', '11px', 'bold');

        group.appendChild(circle);
        group.appendChild(line);
        group.appendChild(varText);
        group.appendChild(numText);
      }

      symbolsLayer.appendChild(group);
      setupSymbolEvents(group);
    }

    function setupSymbolEvents(elem) {
      const handleStart = (e) => {
        if (isPipeMode) return;
        e.stopPropagation();
        selectedElement = elem;
        const pos = getCoords(e);
        const transform = elem.getAttribute('transform');
        const match = /translate\(([^,]+),\s*([^)]+)\)/.exec(transform);
        const currX = match ? parseFloat(match[1]) : 0;
        const currY = match ? parseFloat(match[2]) : 0;
        offset = { x: pos.x - currX, y: pos.y - currY };
      };

      elem.addEventListener('mousedown', handleStart);
      elem.addEventListener('touchstart', handleStart, { passive: false });

      // Doble clic para cambiar nombre/tag
      elem.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        const texts = elem.querySelectorAll('text');
        if (texts.length > 0) {
          const val = prompt('Editar identificador:', texts[0].textContent);
          if (val !== null && val.trim() !== '') {
            texts[0].textContent = val.trim();
          }
        }
      });
    }

    function handleMove(e) {
      const pos = getCoords(e);
      if (selectedElement && !isPipeMode) {
        e.preventDefault();
        const nx = Math.round((pos.x - offset.x) / 10) * 10;
        const ny = Math.round((pos.y - offset.y) / 10) * 10;
        selectedElement.setAttribute('transform', `translate(${nx}, ${ny})`);
      } else if (activePipe && isPipeMode) {
        activePipe.setAttribute('x2', pos.x);
        activePipe.setAttribute('y2', pos.y);
      }
    }

    function handleEnd() {
      selectedElement = null;
    }

    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchend', handleEnd);

    function togglePipeMode() {
      isPipeMode = !isPipeMode;
      pipeBtn.classList.toggle('active-mode', isPipeMode);
      pipeBtn.textContent = isPipeMode ? 'Modo Tubería (Activo)' : 'Trazar Tubería';
      canvas.style.cursor = isPipeMode ? 'cell' : 'crosshair';
      activePipe = null;
    }

    canvas.addEventListener('mousedown', (e) => {
      if (!isPipeMode || e.target.closest('.symbol-group')) return;
      const pos = getCoords(e);
      if (!activePipe) {
        activePipe = document.createElementNS(SVG_NS, 'line');
        activePipe.setAttribute('x1', pos.x);
        activePipe.setAttribute('y1', pos.y);
        activePipe.setAttribute('x2', pos.x);
        activePipe.setAttribute('y2', pos.y);
        activePipe.setAttribute('stroke', '#38bdf8');
        activePipe.setAttribute('stroke-width', '4');
        activePipe.setAttribute('marker-end', 'url(#arrow)');
        pipesLayer.appendChild(activePipe);
      } else {
        activePipe = null;
      }
    });

    function clearCanvas() {
      if (confirm('¿Deseas vaciar todo el diagrama?')) {
        symbolsLayer.innerHTML = '';
        pipesLayer.innerHTML = '';
        activePipe = null;
      }
    }

    function exportSVG() {
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(canvas);
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'diagrama-pid.svg';
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportPNG() {
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(canvas);
      const img = new Image();
      const svgBlob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      img.onload = () => {
        const outCanvas = document.createElement('canvas');
        outCanvas.width = canvas.clientWidth || 1200;
        outCanvas.height = canvas.clientHeight || 800;
        const ctx = outCanvas.getContext('2d');
        ctx.fillStyle = '#181820';
        ctx.fillRect(0, 0, outCanvas.width, outCanvas.height);
        ctx.drawImage(img, 0, 0);

        const a = document.createElement('a');
        a.download = 'diagrama-pid.png';
        a.href = outCanvas.toDataURL('image/png');
        a.click();
        URL.revokeObjectURL(url);
      };
      img.src = url;
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
